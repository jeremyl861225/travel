<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<!-- 刻意不寫 viewport-fit=cover。有它，iOS 會把網頁視窗鋪滿整個螢幕、
     再用 env(safe-area-inset-bottom) 回報 34px 要我們自己讓開 home indicator，
     那 34px 就是頁尾那條空白。拿掉之後 env() 一律回 0，iOS 改成把網頁視窗
     縮到 home indicator 上面——那條變成系統在管，網頁畫不到也不必墊。
     Clinical-Tools 就是這樣，所以它完全沒有頁尾空白。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Travel</title>
<meta name="theme-color" content="#FBF6EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucent 要搭配 viewport-fit=cover 才成立（內容鋪到狀態列底下）。
     兩個一起拿掉，狀態列交還給系統。 -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Travel">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
/* ═══════════════════════════════════════════════════════════════
   手冊分頁板 — 設計系統
   板面是一整片飽和色，板上不印任何字；所有內容都落在牛奶賽璐珞頁上。
   賽璐珞頁的顏色不是寫死的：由 solveLeaf() 在執行期把白色以某個
   alpha 疊在當日板色上，二分搜尋到閱讀場的相對亮度落進固定亮度帶，
   再把結果當成實色發布成 --leaf。因此每一天的頁面都帶著當天的板色，
   而文字對比永遠一樣穩——這是戶外強光下能讀的前提。
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* 七色輪：一天一個色階。朱紅不在輪上，只留給勘誤條。 */
  --hue-0:#D2571C; --hue-1:#E0A70B; --hue-2:#3F8F3A; --hue-3:#0E7A78;
  --hue-4:#1F45A8; --hue-5:#6B3FA0; --hue-6:#8E4A24;
  --vermilion:#D62D14;

  /* 底色是紙，固定不變。當日色不再鋪滿整面，只出現在分頁鐵、DAY 色塊、
     類別方磚、主要按鈕與 focus 邊框——這是參考圖 hero 的作法。 */
  --paper:#FBF6EA;
  --desk:#EFE7D3;      /* 書殼外面的桌面，比紙深一階 */
  --leaf:#FFFDF7;           /* 卡片面，比紙再亮一點點 */
  --leaf-top:#FFFFFF;       /* 下一站那一張 */
  --leaf-sunk:#F5F0E2;      /* 已經過去的 */
  --ink:#1B1A16; --ink2:#4A463C; --ink3:#777368;
  /* 三級規線就是這套設計的層次來源，不是陰影。參考圖整份沒有任何 box-shadow。 */
  --rule1:rgba(27,26,22,.80);   /* 結構線：大區塊分隔 */
  --rule:rgba(27,26,22,.55);    /* 元件框：卡片、按鈕、輸入框 */
  --rule2:rgba(27,26,22,.11);   /* 列間線：卡片內部 */
  --accent:#0E7A78;         /* 當日色，JS 換 */
  --accent-ink:#FFFFFF;     /* 當日色「上面」的字 */
  --accent-line:#0E7A78;    /* 當日色當線條／小字時的暗版，JS 換 */
  --accent-edge:transparent;/* 當日色太淡時補的髮絲邊，JS 換 */
  --accent-rule:rgba(255,255,255,.28); /* 當日色卡片內的規線，JS 換 */
  --btn:#0E7A78;            /* 主要按鈕填色（對比不足時已推暗或推亮） */
  --btn-ink:#FFFFFF;

  /* 拉丁字型一定要排在中文前面：中文字型的拉丁字都不好看
     （PingFang 的偏窄偏圓、Mincho 的是日文用西文），
     排在前面瀏覽器就會逐字取用——拉丁吃西文、中文吃中文。
     介面文字（--sans）維持蘋方：那些是純中文，用日文明體會出現日式字形。
     襯線只給站名與標題（--display）。 */
  --sans:"Helvetica Neue",Helvetica,"PingFang TC",system-ui,sans-serif;
  /* 標題走壓縮怪誕。font-stretch:condensed 對 Helvetica Neue 沒有作用——
     壓縮字面在系統裡是獨立的一支，要直接指名 PostScript 名稱才抓得到
     （實測 "Helvetica Neue Condensed Bold" 抓不到、HelveticaNeue-CondensedBold 抓得到）。
     這支永遠是粗的，所以只用在字重 600 的標題上。
     中文沒有壓縮字面，會落到蘋方，正常寬度——這是要的效果。 */
  /* 標題與站名的中文＝Hiragino Mincho ProN（使用者 2026-08-29 從三案裡選定）。
     這是 iOS 上唯一的明體，日文字型；站名幾乎都是日文地名
     （滝の湯、瑞巖寺、五色沼），用日文明體的字面在這裡是對的。
     代價是純中文的字會拿到日式字形（直骨具海每令兩步者都綠錄），已確認接受。

     **不要把 Songti TC 加回來排在前面。** 那是 macOS 才有的字，iOS 沒有
     （實機探測只有 Hiragino Mincho ProN、Heiti TC、PingFang TC 三支）；
     排前面會變成 Mac 看到宋體、iPhone 看到明體，同一份設計兩種長相。
     Hiragino Mincho ProN 在 macOS 也有，放第一位兩邊才一致。 */
  --display:"HelveticaNeue-CondensedBold","Avenir Next Condensed",
            "Helvetica Neue",Helvetica,"Hiragino Mincho ProN",serif;
  /* 內文改走黑體：宋體的橫畫是髮絲，14.5px 在 iPhone 上會整段泛灰、筆畫斷裂。
     襯線留給標題用。 */
  --serif:"Helvetica Neue",Helvetica,"PingFang TC",sans-serif;
  /* 數字與英文改用 Avenir Next（iOS/macOS 內建）。它不是等寬字，
     時刻的直豎對齊改靠 tabular-nums——那個特性只讓「數字」等寬，
     英文字母仍是正常字寬，所以比 SF Mono 開闊也更耐看。
     中文遇到它一樣會落到蘋方，跟原本一樣。 */
  --mono:"Avenir Next",Avenir,"Helvetica Neue",sans-serif;

  --r:8px; --r2:5px;        /* 圓角：控制元件比卡片再小一階 */
  --step:90ms;              /* 唯一的動作長度 */
  --rail:44px;              /* 書口分頁鐵 */
  --bind:10px;              /* 左緣留白 */
  --dock:46px;
  /* 沒有 viewport-fit=cover 時 env() 一律回 0，這裡等於恆為 0。
     定義留著是為了「哪天真的要鋪滿螢幕」時改一行就回得去。 */
  --sab:0px;
  --vtop:0px;         /* 鍵盤把版面視窗捲掉的量，JS 實測寫入 */
  --tcol:58px;        /* 時刻欄的寬度＝那條分界線的位置 */
}
@media (display-mode: standalone), (display-mode: fullscreen){
  :root{ --sab:env(safe-area-inset-bottom); }
}
@media (prefers-reduced-motion: reduce){ :root{ --step:1ms } }

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* iOS Safari 的 inset:0 指的是版面視窗，比看得到的區域高；用 dvh 才貼齊 */
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--paper)}
body{
  font-family:var(--sans); background:var(--paper); color:var(--ink);
  font-size:15px; line-height:1.45; overscroll-behavior:none;
  /* 全站數字等寬對齊；只有襯線內文回到比例數字，那裡對齊不重要、好看比較重要 */
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none}
/* 中文字重上限 600。<b> 與 <strong> 預設是 700，不覆寫就會被 iOS 假造粗體。 */
b,strong{font-weight:600}
/* 中文字型沒有義大利體，<em> 會被瀏覽器假斜體毀掉，改用色與字距表示強調。 */
em{font-style:normal;color:var(--ink);letter-spacing:.03em}
button{cursor:pointer}
a{color:inherit}

/* 這個世界沒有緩動曲線。所有變化都是 90ms 的兩格步進。 */
.step{transition:transform var(--step) steps(2),opacity var(--step) steps(2)}

/* ── 版面骨架 ───────────────────────────────────────────── */
#app{
  position:fixed; left:0; right:0; top:var(--vtop,0px); height:var(--vh, 100dvh);
  display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 0 0;
  background:var(--desk);
}
/* 書殼。整本活頁本是一個實體：有上下邊、有圓角、坐在比它深一階的桌面上。
   操作列刻意留在殼外——那是手的位置，不是紙的位置。 */
.case{
  flex:1 1 auto; min-height:0; margin:0 5px;
  display:grid; grid-template-columns:1fr var(--rail);
  background:var(--paper); border-radius:11px;
  box-shadow:0 0 0 1px var(--rule2), 0 1px 3px rgba(27,26,22,.10), 0 6px 16px rgba(27,26,22,.06);
  overflow:hidden;
}
.plate{
  position:relative; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:10px 0 18px var(--bind);
  scroll-padding-top:80px; touch-action:pan-y;
}

/* ── 書口分頁鐵 ─────────────────────────────────────────── */
.rail{
  position:relative; display:flex; flex-direction:column; gap:2px;
  padding:10px 0 8px 0;
  background:rgba(27,26,22,.06); overflow-y:auto; scrollbar-width:none;
}
.rail::-webkit-scrollbar{display:none}
.tab{
  position:relative; flex:0 0 auto; min-height:0; height:60px;
  writing-mode:vertical-rl; text-orientation:mixed;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  font-family:var(--sans); font-size:12.5px; font-weight:600; letter-spacing:.02em;
  border:none; border-radius:0 7px 7px 0;
  margin-left:3px; padding:10px 0; white-space:nowrap;
  box-shadow:inset 1px 0 0 rgba(0,0,0,.22), inset 0 0 0 1px var(--accent-edge);
}
.tab .td{font-family:var(--mono);font-size:9.5px;font-weight:500;opacity:.76;letter-spacing:.03em}
.tab.cjk{letter-spacing:.14em;font-size:12.5px}
/* 褪色的分頁：白字壓在極淺灰上對比只有 1.9:1，是刻意的——
   它要讀得出來但不能跟當天搶。內縮的暗邊維持形狀，不然會整片糊掉。 */
.tab.past{box-shadow:inset 1px 0 0 rgba(0,0,0,.10)}
.tab.past .td{opacity:.9}
/* 當日分頁向左延伸，與板面接成同一塊 */
.tab.on{margin-left:0;border-radius:0;box-shadow:none;font-weight:600;font-size:13.5px}
.tab.on .td{opacity:.9}
.tab.on::after{
  content:""; position:absolute; left:-6px; top:0; bottom:0; width:8px; background:inherit;
}

/* ── 賽璐珞頁 ───────────────────────────────────────────── */
.leaf{
  position:relative; margin:0 12px 0 0;
  background:var(--accent); color:var(--accent-ink);
  border:none; border-radius:4px; overflow:hidden;
  /* 沒有邊框之後，太淡的當日色（例如近白的 F5）會整張融進紙裡，
     所以只在對紙對比不足時補一道內描邊，其餘日子是完全無框的。 */
  box-shadow:inset 0 0 0 1px var(--accent-edge);
}
/* 口袋沒有路程列，兩張卡會直接相黏。這條只在「真的相鄰」時生效，
   一般日子中間隔著路程列，選擇器不成立，版面不受影響。 */
.leaf + .leaf{margin-top:7px}
/* 下一站：卡片左緣一道當日色的書口，比整張換色安靜 */
.leaf.past{opacity:.52}
/* 空狀態卡在色底上：字色一律繼承，別再用紙底時代的灰 */
.leaf.empty{padding:16px 15px 17px}
.leaf.empty .lname{font-size:15.5px}
.leaf.empty p{font-family:var(--mono);font-size:10.5px;line-height:1.7;opacity:.82;margin-top:6px}
.leaf.drag{box-shadow:0 0 0 2px var(--ink);position:relative;z-index:30}
.leaf.ghost{opacity:.28}

/* 頁的內部格線：邊欄放機器語與刻印，主欄放內容 */
.lrow{display:grid;grid-template-columns:var(--tcol) 1fr auto;align-items:stretch}
/* 地圖鍵自成一欄，不能包在 data-open 裡面——包進去點一下會連地圖也展開卡片。
   命中區維持 44px 寬、整條高，拇指按得到。 */
.lmap{display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:36px;color:inherit;opacity:.62;text-decoration:none;
  border-left:1px solid var(--accent-rule)}
.lmap:active{opacity:1}
.lmap .mark{width:17px;height:17px;stroke-width:1.9}
/* 時刻欄收窄到剛好裝得下 09:41，內容置中——原本欄寬 70px、內容靠左，
   右邊多出來的空白讓那條分界線看起來離時刻很遠。 */
.lmar{
  padding:8px 5px 8px 5px; border-right:1px solid var(--accent-rule);
  display:flex;flex-direction:column;gap:2px;align-items:center;
}
.ltime{font-family:var(--mono);font-size:15.5px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.lstay{font-family:var(--mono);font-size:10.5px;opacity:.78;letter-spacing:.02em;line-height:1.35}
.lstay.pin{opacity:1;font-weight:600}
.lbody{padding:8px 7px 9px 10px;min-width:0;display:flex;gap:9px;align-items:flex-start}
.lname{font-family:var(--display);font-size:15.5px;font-weight:600;letter-spacing:-.012em;
  line-height:1.16;word-break:break-word}
.lmeta{display:flex;flex-wrap:wrap;gap:2px 7px;align-items:center;margin-top:3px;
  font-family:var(--mono);font-size:10.5px;opacity:.82;letter-spacing:.02em}
.lmeta .sep{opacity:.55}
/* 地點欄位：左邊一個字的標籤、中間可換行的內容、右邊複製鍵。
   用 grid 不用 flex——地址常常兩三行，flex 會把複製鍵推到最下面。 */
.addr{display:grid;grid-template-columns:18px 1fr auto;gap:6px;align-items:start;
  margin-bottom:5px;font-family:var(--mono);font-size:12px;line-height:1.5}
.addrlab{font-size:10px;opacity:.62;padding-top:2px;letter-spacing:.06em}
.addrtxt{min-width:0;word-break:break-word;text-decoration:none}
/* 複製鍵對齊文字的第一行，不是整塊置中——地址常常兩三行，
   置中會讓按鈕飄到兩行中間，跟哪一行都對不上。 */
/* 選擇器要寫成 .btn.addrcopy：.btn 的 min-height:31px 定義在後面，
   單靠 .addrcopy 權重一樣、順序落後，會被蓋掉（實測按鈕還是 31px 高）。 */
.btn.addrcopy{align-self:start;margin-top:1px;min-height:18px;padding:0 6px;font-size:9.5px;
  border-color:currentColor;color:inherit;opacity:.7;letter-spacing:.02em}
.laddr{font-family:var(--mono);font-size:11px;opacity:.8;margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 類別刻印：單一線寬的線稿，不是彩色圓點 */
.mark{width:19px;height:19px;display:block;stroke:currentColor;fill:none;
  stroke-width:1.6;stroke-linecap:square;stroke-linejoin:miter}
.mark.sm{width:17px;height:17px;stroke-width:2}
.mark.xs{width:13px;height:13px;stroke-width:2.1}
/* 參考站的實心方磚：線稿住在一塊當日板色裡，不是散落的彩色小圓點 */
.tile{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--accent-ink);
  margin-top:1px;box-shadow:inset 0 0 0 1px var(--accent-edge)}
.tile .mark{width:16px;height:16px;stroke-width:2}

/* 選取＝打孔：孔裡看得到板色 */
.punch{
  width:15px;height:15px;border-radius:50%;flex:0 0 auto;
  border:1px solid currentColor;background:transparent;display:inline-block;vertical-align:-2px;
}
.punch.on{background:currentColor;border-color:currentColor}

/* 勘誤條：朱紅，只有這裡用得到 */
.errata{
  display:flex;gap:7px;align-items:flex-start;
  background:var(--vermilion);color:#fff;padding:6px 10px 7px;
  font-family:var(--mono);font-size:11px;letter-spacing:.02em;line-height:1.5;
  border-top:1px solid rgba(0,0,0,.25);
}
.errata b{font-weight:600}
.warn{background:#B8801A}

/* ── 鉸鏈與區間欄（兩頁之間的路程） ───────────────────────── */
.hinge{
  position:relative;margin:0 12px 0 0;height:31px;display:flex;align-items:center;gap:8px;
  padding-left:10px;
}
.leg{
  display:inline-flex;align-items:center;gap:7px;background:transparent;
  border:none;padding:3px 0 4px 2px;
  font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:var(--ink2);
  text-decoration:none;
}
.legedit{border:1px solid var(--rule);border-radius:4px;padding:0 5px 1px;font-size:10px}
/* 估算值一定要看得出是估的 */
.est{opacity:.6;font-size:10px}
.leg.miss{color:var(--ink3)}
/* 釘選造成的等待＝行程裡真的有空的時間，寫在板色上，跟紙上的路程分開 */
.gap{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink3);
  white-space:nowrap}
.leg b{font-weight:600;font-size:11.5px}

/* ── 頁首那一頁（板上不印字，所以標題也住在頁上） ─────────── */
/* 日首不畫框。它跟下面的卡片本來就不是同一種東西——
   卡片是行程，這裡是這一天的儀表；框起來反而讓它看起來也是一張卡。
   底下一條細線就夠把它跟第一張卡分開。 */
.head{margin:0 12px 10px 0;background:transparent;overflow:hidden;
  border:none;border-bottom:1px solid var(--rule2);border-radius:0}
.headtop{border-bottom:none;padding-left:0}
.headbody{padding-left:0;padding-right:4px}
.headmar{padding-left:0}
.startrow{padding-left:0}
/* 參考站那條迷你長條圖：一根柱子是一站，高度是停留時間 */
/* 一天的形狀：軌是整天的跨度，膠囊是待在某個地方的時間，
   膠囊之間的空白就是移動與空檔；直線是釘選的固定時刻。 */
.strip{position:relative;height:14px;margin-top:10px;
  background:rgba(27,26,22,.09);border-radius:99px}
.strip i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:99px}
.strip b{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--ink);opacity:.55}
/* 「現在」：整條時間軸上唯一會動的東西，給它朱紅與全高，跟膠囊分開讀。 */
.strip u{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--vermilion);
  text-decoration:none;border-radius:1px}
.striplab{display:flex;justify-content:space-between;margin-top:4px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;color:var(--ink3)}
.striplab span:nth-child(2){opacity:.75}
.headtop{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 10px;border-bottom:1px solid var(--rule2)}
/* 返回是導覽不是動作，不給框；左緣與下面的 DAY 方磚同一條線。 */
/* 返回鍵用 display:flex 而不是 inline：inline 元素的高度由字面決定，
   裡面是 SVG 就會被基線往下拉，跟旁邊的文字對不齊。 */
/* margin-left 的負值不是隨手調的：m-back 的筆畫從 viewBox 的 x=3 開始，
   24 格縮到 16px 就是 2px 的空白。框切齊了、墨還是偏右 2px，
   要扣掉才會跟下面 DAY 的字緣真的對在同一條線上。 */
.backb{border:none;background:none;padding:0;min-height:0;flex:0 0 auto;
  margin-left:-2px;
  display:flex;align-items:center;color:var(--ink2);
  -webkit-appearance:none; appearance:none}
.backb .mark{width:16px;height:16px;stroke-width:2}
.backb:active{background:none;color:var(--ink)}
/* 旅程名走標題字（明體）。原本是 Avenir Next 全大寫加字距——
   那對拉丁有效，中文不會變大寫，只剩被拉開的字距，看起來像沒設計過。 */
.trip{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:-.01em;
  color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.headmain{display:grid;grid-template-columns:70px 1fr;align-items:start}
/* DAY 那一欄不再是色塊，改成超粗的字直接承載當日色。
   色用 --accent-line（當日色壓到紙上讀得動的那一階），不是 --accent 原色——
   鼠尾草、橄欖金對紙只有 2.7:1，直接拿來當字色會糊掉。
   「超粗」不能靠 font-weight：中文沒有 700 以上的字面，寫上去是 iOS 演算法
   假造的，邊緣會爛。改用 text-stroke 沿著字的外框加一圈，粗得乾淨。 */
.headmar{padding:10px 6px 11px 10px;color:var(--accent-line)}
.dnum{font-family:var(--display);font-size:12px;letter-spacing:.16em;font-weight:600;
  -webkit-text-stroke:.35px currentColor}
.dbig{font-size:42px;font-weight:600;line-height:.86;letter-spacing:-.05em;margin-top:1px;
  font-family:var(--display);-webkit-text-stroke:.9px currentColor}
.headbody{padding:9px 12px 10px}
.ddate{font-size:15.5px;font-weight:600;letter-spacing:-.015em;line-height:1.2;font-family:var(--display)}
.ddate .num{font-family:var(--mono);font-size:17px;letter-spacing:-.02em}
.dsub{font-family:var(--mono);font-size:10.5px;color:var(--ink2);margin-top:3px;letter-spacing:.02em;line-height:1.42}
.startrow{display:flex;align-items:center;gap:7px;flex-wrap:nowrap;padding:0 12px 11px 10px}
.startrow .btn{min-height:28px;padding:0 11px;font-size:11px;flex:0 0 auto}

/* ── 通用小零件 ─────────────────────────────────────────── */
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:31px;padding:0 12px;border:1px solid var(--rule);border-radius:var(--r2);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;background:transparent;
  text-decoration:none;
  /* 上下不能有內距。內距會把內容盒壓到只剩 16px，而中英混排的行盒是
     兩套字面的聯集——蘋方的 ascent 比 Avenir Next 高，iOS 上塞不下就往上頂，
     於是整排字看起來偏上。把上下內距歸零、高度交給 min-height，
     內容盒有 31px，行盒才有餘裕真的被置中。
     -webkit-appearance 也要關掉，否則 iOS 會用它自己的算法排按鈕內文。 */
  line-height:1.15;
  -webkit-appearance:none; appearance:none;
}
/* 次要鍵按下＝整塊翻黑；主要鍵按下＝框線加重，填色不變。兩種刻意不同。 */
.btn:active{background:var(--ink);color:var(--leaf);border-color:var(--ink)}
.btn.fill:active{background:var(--btn);color:var(--btn-ink);
  box-shadow:inset 0 0 0 2px var(--rule1)}
/* 主要動作用當日板色，跟參考站的實心黃鍵同一手 */
.btn.fill{background:var(--btn);color:var(--btn-ink);border-color:var(--rule1);font-weight:600}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4}
.inp{
  width:100%;min-width:0;max-width:100%;
  background:transparent;border:1px solid var(--rule);border-radius:var(--r2);
  padding:7px 10px;font-family:var(--mono);font-size:13.5px;letter-spacing:.02em;
}
/* iOS 的 date／time／number 有自己的內建寬度，width:100% 壓不住，
   會撐破格線壓到隔壁欄位上。關掉原生外觀才收得回來。 */
input[type=date].inp, input[type=time].inp, input[type=number].inp{
  -webkit-appearance:none; appearance:none; text-align:left;
}
input[type=date].inp::-webkit-date-and-time-value{ text-align:left; }
input[type=number].inp{ -moz-appearance:textfield; }
/* 焦點是邊框變色加粗，不是 outline、不是 glow。用當日色的暗版，
   因為鉻黃那種亮色當 1px 線在紙上只有 1.5:1，等於看不見。 */
.inp:focus{outline:none;border-color:var(--accent-line);
  box-shadow:inset 0 0 0 1px var(--accent-line)}
textarea.inp{font-family:var(--serif);font-size:15px;line-height:1.65;letter-spacing:0;min-height:120px;resize:vertical}
.hint{font-family:var(--mono);font-size:10px;color:var(--ink3);line-height:1.55;margin-top:5px}
/* 打字搜尋的候選。整塊是 button，命中區才夠大；手機上點小字很痛苦。 */
.aclist{margin-top:6px;border:1px solid var(--rule);border-radius:var(--r2);overflow:hidden}
.acitem{display:block;width:100%;text-align:left;padding:9px 11px;background:none;border:none;
  border-bottom:1px solid var(--rule2)}
.acitem:last-child{border-bottom:none}
.acitem:active{background:var(--ink);color:var(--leaf)}
.acmain{font-family:var(--serif);font-size:14.5px;line-height:1.3}
.acsub{font-family:var(--mono);font-size:10.5px;opacity:.7;margin-top:2px;line-height:1.35}
.acbusy{font-family:var(--mono);font-size:10.5px;color:var(--ink3);padding:8px 2px}
.leaf .hint,.leaf .lab{color:inherit;opacity:.75}
/* 長程駕駛與雨勢：兩個都是「你該知道但不是錯誤」的層級，
   所以用琥珀而不是勘誤朱紅——朱紅要留給真的排錯的東西。 */
.longdrive{font-family:var(--mono);font-size:10px;letter-spacing:.02em;
  color:#8A6A12;background:rgba(191,138,18,.14);padding:1px 6px;border-radius:3px}
.rainchip{font-family:var(--mono);font-size:10.5px;color:inherit;opacity:.9}

/* ── 底部操作列（拇指可及） ─────────────────────────────── */
/* 操作列在書殼外面，正常流排版。按鈕靠右——手機的左下角是圓角，
   貼在那裡的鍵會被螢幕自己的圓角切掉。 */
.dock{
  flex:0 0 auto; z-index:20;
  height:calc(var(--dock) + var(--sab));
  /* 右邊留出分頁鐵的寬度（＋書殼的側邊距），讓「已同步」的右緣
     正好落在紙與分頁鐵的分界線上，跟上面的內容切齊。 */
  padding:0 calc(var(--rail) + 5px) var(--sab) 12px;
  display:flex;align-items:center;gap:8px;
  background:transparent;border:none;
}
.dock .btn{flex:0 0 auto;min-height:33px;padding:0 12px;font-size:11.5px}
.dock .grow{flex:1 1 auto}
.sync{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink3);text-align:right;line-height:1.3;flex:0 0 auto;margin-left:4px;background:none;border:none}
.sync.err{color:var(--vermilion)}

/* ── 抽頁（sheet）：以打孔邊為軸的兩格步進，不淡入 ────────── */
.sheetwrap{position:fixed;left:0;right:0;top:var(--vtop,0px);height:var(--vh, 100dvh);z-index:60;display:none}
.sheetwrap.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42)}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;
  background:var(--leaf);border-top:1px solid var(--rule2);
  border-radius:20px 20px 0 0;
  padding:0 0 calc(var(--sab) + 16px);
  transform:translateY(100%);transition:transform var(--step) steps(2);
}
.sheetwrap.open .sheet{transform:translateY(0)}
.sheethead{
  position:sticky;top:0;z-index:2;background:var(--leaf);border-radius:20px 20px 0 0;
  display:flex;align-items:center;gap:10px;padding:13px 15px 11px;
  border-bottom:1px solid var(--rule);
}
.sheethead h2{font-family:var(--sans);font-size:17px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheetbody{padding:14px}
/* 手冊的四欄格線在窄螢幕收成一欄，標籤吊在邊欄 */
.fld{display:grid;grid-template-columns:70px 1fr;gap:9px;align-items:start;margin-bottom:10px}
.fld > .lab{padding-top:10px;text-align:right}
.fld.stack{grid-template-columns:1fr}
.fld.stack > .lab{text-align:left;padding-top:0;margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* 拉丁的 1.5 對繁中太緊，內文要 1.75–1.85 */
.prose{font-family:var(--serif);font-size:14.5px;line-height:1.72;
  font-variant-numeric:normal;font-feature-settings:normal;
  hanging-punctuation:allow-end}

/* 類別選擇：刻印＋文字，不靠顏色分辨 */
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);
  padding:6px 12px;border-radius:999px;font-size:12px;letter-spacing:.01em}
.cat.on{background:var(--accent);color:var(--accent-ink);border-color:var(--rule1);font-weight:600}

/* 待辦（預定）：勾選就是打一個孔 */
.todo{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid var(--accent-rule)}
.todo .t{flex:1;font-size:14.5px;line-height:1.4}
.todo.done .t{opacity:.6;text-decoration:line-through}

/* 卡片展開後的內文（宋體，一個尺寸做完） */
/* 展開後的欄位切齊上面那條分界線：標籤佔的就是時刻欄，
   內容從分界線之後開始，整張卡只有一條垂直的視覺線。 */
.detail{border-top:1px solid var(--accent-rule);padding:0 12px 12px 0}
.detail .blk{display:grid;grid-template-columns:var(--tcol) 1fr;gap:0;padding-top:12px}
.detail .blk > .lab{padding-left:5px;text-align:center}
/* 介紹與動作不掛標籤，段落直接鋪滿 */
.detail .blk.full{grid-template-columns:1fr;padding-left:12px}
.detail .blk > .lab{padding-right:10px;text-align:right;padding-top:4px;color:inherit;opacity:.62}
.detail .blk > div{min-width:0}
/* 卡片變成當日色底之後，卡上的按鈕不能再用紙色那套邊框 */
.detail .btn{border-color:currentColor;opacity:.92}
.detail .btn:active{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.hours{font-family:var(--mono);font-size:11px;line-height:1.62;opacity:.85}
.hours .today{opacity:1;font-weight:600}
.linkline{display:block;font-family:var(--mono);font-size:12px;padding:3px 0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imgs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.imgs img{height:96px;border:1px solid var(--rule2);border-radius:9px;background:rgba(0,0,0,.06)}

/* ── 進場／旅程列表 ─────────────────────────────────────── */
.gate{position:fixed;left:0;right:0;top:var(--vtop,0px);height:var(--vh, 100dvh);z-index:70;background:var(--paper);overflow-y:auto;display:none;
  padding:calc(env(safe-area-inset-top) + 18px) 13px calc(var(--sab) + 20px)}
.gate.on{display:block}
.brand{color:var(--ink2);font-family:var(--mono);letter-spacing:.3em;
  text-transform:uppercase;font-size:10.5px}
.brandbig{font-family:var(--display);color:var(--ink);font-size:31px;font-weight:600;letter-spacing:-.04em;
  line-height:.96;margin:4px 0 15px;font-family:var(--display)}
.panel{background:var(--leaf);border:1px solid rgba(27,26,22,.20);border-radius:var(--r);
  padding:12px 13px 13px;margin-bottom:9px}
.panel h3{font-family:var(--sans);font-size:14px;font-weight:600;margin-bottom:8px;letter-spacing:-.01em}
.triprow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule2);width:100%;text-align:left}
.triprow:last-child{border-bottom:none}
.tripname{flex:1;min-width:0}
.tripname b{display:block;font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tripname span{display:block;font-family:var(--mono);font-size:10px;color:var(--ink2);
  letter-spacing:.03em;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:calc(var(--dock) + var(--sab) + 14px);
  transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--leaf);
  font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;padding:10px 16px;
  border:1px solid var(--ink);border-radius:999px;max-width:88vw;text-align:center;display:none}
.toast.on{display:block}
.hide{display:none!important}
</style>
</head>

'use strict';
/* ═══════════════════════════════════════════════════════════════

<script>

/* ═══ 加密 ═══════════════════════════════════════════════════

const te = new TextEncoder(), td = new TextDecoder();

const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: unb64(saltB64), iterations: iters || CFG.iters, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, true, ['encrypt','decrypt']);

   只有 SECURITY DEFINER 的函式讀得到它。 */
async function authHash(code, pass, saltB64) {
  const raw = te.encode(String(code).toUpperCase() + ':' + pass + ':' + saltB64);
  return b64(await crypto.subtle.digest('SHA-256', raw));

  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, te.encode(JSON.stringify(obj)));
  const out = new Uint8Array(12 + ct.byteLength);
  out.set(iv, 0); out.set(new Uint8Array(ct), 12);
  return b64(out);
}

  const raw = unb64(s);

  return JSON.parse(td.decode(pt));

<script>
'use strict';
/* ═══ 時刻推算 ═══════════════════════════════════════════════
   使用者只給「停留多久」與順序，其餘由這裡負責。
   釘選的卡片是固定點：到得早就等，到得晚就把落後量一路帶下去。 */
function computeSchedule(d) {
  const list = dayCards(d);
  let t = hm2min(dayStart(d));
  if (t == null) t = 8 * 60 + 30;
  const out = list.map((c, i) => {
    const pin = hm2min(c.data.pinTime);
    let arrive = t, wait = 0, late = 0, rebased = false, drift = 0;
    /* 現地重新基準：使用者在某一站按「我在這裡」，那一站的抵達時刻就
       改成當下的真實時間，後面整條全部跟著重推。這只存在這台裝置，
       不同步——它是「我現在的狀態」，不是行程本身。 */
    const rb = (S.rebase && S.rebase.day === d && S.rebase.id === c.id) ? S.rebase.min : null;
    if (rb != null) {
      drift = rb - t; arrive = rb; rebased = true;
      if (drift > 0) late = drift; else wait = -drift;
    } else if (pin != null) {
      if (pin >= t) { arrive = pin; wait = pin - t; }
      else { arrive = t; late = t - pin; }
    }
    const stay = Number(c.data.stayMin) || 0;
    const depart = arrive + stay;
    const leg = i < list.length - 1 ? legOf(c, list[i + 1]) : null;
    const legMin = leg && leg.min != null ? Number(leg.min) : null;
    t = depart + (legMin == null ? 0 : legMin);

     這是儀表盤那套紀律：先看得到偏移量，才輪到紅色警告。 */
  let nextPinIdx = -1;
  for (let i = out.length - 1; i >= 0; i--) {
    out[i].nextPinIdx = nextPinIdx;
    if (out[i].pin != null) nextPinIdx = i;
  }
  out.forEach(r => {
    if (r.nextPinIdx >= 0) {
      const n = out[r.nextPinIdx];
      r.pinTarget = n.pin;
      r.pinName = n.card.data.name;
      r.pinDrift = n.late > 0 ? n.late : -(n.wait);   // 正數＝慢了，負數＝有餘裕
    }
  });

  /* 營業時間比對：到的時候有沒有開門。 */
  const dp = dateParts(dayDate(d));
  out.forEach(r => {
    const per = r.card.data.place && r.card.data.place.hoursPeriods;
    r.hours = isOpenAt(per, dp.w, r.arrive);
    const per2 = per;
    if (per2 && r.hours.open) {
      const atLeave = isOpenAt(per2, dp.w, r.depart);
      r.leaveClosed = !atLeave.open && !atLeave.unknown;
    }
    /* 最後入場。日本的館所普遍在閉館前 30 分就停止入場，
       Google 的營業時間只給閉館時刻，光看它會白跑一趟。
       這個值是人手填的（分鐘，閉館前多久），沒填就不判斷。 */
    const le = Number(r.card.data.lastEntry) || 0;
    if (le > 0 && per2) {
      const close = closeMinOn(per2, dp.w, r.arrive);
      if (close != null && r.arrive > close - le) {
        r.lateEntry = { close, limit: close - le };
      }
    }
  });
  return out;
}

/* Google 的 periods 以星期日為 0，跨夜的時段 close.day 會落在隔天。 */
/* 這一天整天沒開。Google 的 periods 只列出有營業的區段，
   某個 day 完全不出現就是那天公休；24 小時營業的店 periods 只有一筆
   而且沒有 close，那種要視為每天都開。 */
function closedAllDay(periods, weekday) {
  if (!periods || !periods.length) return false;
  if (periods.length === 1 && !periods[0].close) return false;   // 24 小時
  return !periods.some(p => p.open && p.open.day === weekday);
}
/* 那一天涵蓋這個時刻的營業區段是幾點結束。跨夜的區段 close.day 會落在隔天，
   要把它加回 1440 才比得出來。找不到就回 null（不營業或資料不足）。 */
function closeMinOn(periods, weekday, minutes) {
  if (!periods || !periods.length) return null;
  if (periods.length === 1 && !periods[0].close) return null;      // 24 小時
  let best = null;
  for (const p of periods) {
    if (!p.open || !p.close) continue;
    let o = p.open.hour * 60 + (p.open.minute || 0);
    let c = p.close.hour * 60 + (p.close.minute || 0);
    let day = p.open.day;
    if (p.close.day !== p.open.day) c += 1440;
    if (day !== weekday) continue;
    if (minutes >= o && minutes <= c) { if (best == null || c < best) best = c; }
  }
  return best;
}
function isOpenAt(periods, weekday, minutes) {
  if (!periods || !periods.length) return { unknown:true, open:false };
  const off = Math.floor(minutes / 1440);
  const w = ((weekday + off) % 7 + 7) % 7;
  const m = ((minutes % 1440) + 1440) % 1440;
  const t = w * 1440 + m;
  for (const p of periods) {
    if (!p || !p.open) continue;
    if (!p.close) return { unknown:false, open:true };            // 24 小時營業
    const start = p.open.day * 1440 + (p.open.hour || 0) * 60 + (p.open.minute || 0);
    let end = p.close.day * 1440 + (p.close.hour || 0) * 60 + (p.close.minute || 0);
    if (end <= start) end += 7 * 1440;
    if ((t >= start && t < end) || (t + 7 * 1440 >= start && t + 7 * 1440 < end))
      return { unknown:false, open:true };
  }
  return { unknown:false, open:false };
}

/* ═══ 雲端同步 ═══════════════════════════════════════════════ */
async function rpc(fn, args) {
  const r = await fetch(CFG.url + '/rest/v1/rpc/' + fn, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey:CFG.key, Authorization:'Bearer ' + CFG.key },
    body: JSON.stringify(args),
  });
  const txt = await r.text();
  if (!r.ok) { const e = new Error(txt || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return txt ? JSON.parse(txt) : null;
}

async function pushCard(c) {
  const payload = await encJSON(c.data, S.key);
  const rows = await rpc('travel_card_push', {
    p_code: S.trip.code, p_auth_hash: S.auth, p_id: c.id,
    p_day_index: c.dayIndex, p_order_key: c.orderKey, p_payload: payload,
    p_deleted: !!c.deleted, p_base_rev: c.rev || 0, p_updated_by: S.trip.nick || '',
  });
  const row = rows && rows[0];
  if (!row) throw new Error('EMPTY_PUSH');
  if (row.ok === false) {
    /* 別人先改了同一張。不猜誰對——把對方的版本擺出來讓人選。 */
    c.conflict = { data: await decJSON(row.payload, S.key), rev: row.rev,
                   by: row.updated_by, at: row.updated_at,
                   dayIndex: row.day_index, orderKey: row.order_key };
    await dbPut('cards', c);
    return false;
  }
  c.rev = row.rev; c.dirty = false; c.conflict = null; c.updatedAt = row.updated_at;
  await dbPut('cards', c);
  return true;
}

async function pullCards() {
  const rows = await rpc('travel_cards_pull', {
    p_code: S.trip.code, p_auth_hash: S.auth, p_since: S.trip.lastPull || null,
  });
  let newest = S.trip.lastPull || null;
  for (const row of (rows || [])) {
    if (!newest || row.updated_at > newest) newest = row.updated_at;
    const local = S.cards.find(c => c.id === row.id);
    if (local && local.dirty && local.rev !== row.rev) {
      local.conflict = { data: await decJSON(row.payload, S.key), rev: row.rev,
                         by: row.updated_by, at: row.updated_at,
                         dayIndex: row.day_index, orderKey: row.order_key };
      await dbPut('cards', local);
      continue;
    }
    if (local && local.rev === row.rev && !local.dirty) continue;
    const rec = {
      id: row.id, trip: S.trip.code, dayIndex: row.day_index, orderKey: row.order_key,
      data: await decJSON(row.payload, S.key), rev: row.rev, deleted: row.deleted,
      dirty:false, conflict:null, updatedBy: row.updated_by, updatedAt: row.updated_at,
    };
    await dbPut('cards', rec);
    const i = S.cards.findIndex(c => c.id === row.id);
    if (i >= 0) S.cards[i] = rec; else S.cards.push(rec);
  }
  if (newest !== S.trip.lastPull) { S.trip.lastPull = newest; await saveTripLocal(); }
}

async function pushMeta() {
  const meta = await encJSON(tripMeta(), S.key);
  const rows = await rpc('travel_push_meta', {
    p_code: S.trip.code, p_auth_hash: S.auth, p_meta: meta, p_base_rev: S.trip.metaRev || 1,
  });
  const row = rows && rows[0];
  if (!row) return false;
  if (row.ok === false) {
    /* 設定撞車就以雲端為準：它的內容量小，重打一次比合併划算。 */
    Object.assign(S.trip, await decJSON(row.meta, S.key));
    S.trip.metaRev = row.meta_rev; S.trip.dirtyMeta = false;
    await saveTripLocal();
    toast('旅程設定已被其他人更新，已改用雲端版本');
    return false;
  }
  S.trip.metaRev = row.meta_rev; S.trip.dirtyMeta = false;
  await saveTripLocal();
  return true;
}

let syncTimer = null;
async function syncNow(quiet) {
  if (!S.trip || !S.key || S.syncing) return;
  if (!navigator.onLine) { S.syncErr = ''; renderSync(); return; }
  S.syncing = true; S.syncErr = ''; renderSync();
  try {
    if (S.trip.dirtyMeta) await pushMeta();
    for (const c of S.cards.filter(c => c.dirty && !c.conflict)) await pushCard(c);
    await pullCards();
    S.trip.lastSync = new Date().toISOString();
    await saveTripLocal();
    if (!quiet) toast('已同步');
    render();
  } catch (e) {
    S.syncErr = String(e.message || e).slice(0, 120);
  } finally {
    S.syncing = false; renderSync();
  }
}
function startSyncLoop() {
  clearInterval(syncTimer);
  /* 前景每 12 秒對一次，離開畫面就停——旅遊時電量比即時性重要。 */
  syncTimer = setInterval(() => {
    if (document.visibilityState === 'visible' && !$('#app').classList.contains('hide')) syncNow(true);
  }, 12000);
}

/* ═══ Google 地圖代理 ═══════════════════════════════════════ */
async function gmap(op, body) {
  const r = await fetch(CFG.url + '/functions/v1/gmap', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey:CFG.key, Authorization:'Bearer ' + CFG.key },
    body: JSON.stringify(Object.assign({ op, code:S.trip.code, authHash:S.auth }, body)),
  });
  let j = null;
  try { j = await r.json(); } catch (e) { j = null; }
  if (!r.ok) {
    const err = new Error((j && j.error) || ('HTTP ' + r.status));
    err.code = (j && j.error) || ('HTTP_' + r.status);
    throw err;
  }
  return j;
}
function gmapMsg(e) {
  if (e.code === 'NO_API_KEY') return '還沒設定 Google API key，請先手動填寫（見 docs/GOOGLE-MAPS-SETUP.md）';
  if (e.code === 'NOT_FOUND')  return 'Google 找不到這個地點，請改用名稱搜尋或手動填寫';
  if (e.code === 'AUTH_FAILED') return '旅程驗證失敗，請重新進入旅程';
  return '抓取失敗：' + (e.code || e.message);
}

/* 自動補上還沒算過的路程。只算「兩端都有座標、而且還沒有結果」的段，
   順序改了才會失效重算——每一段都是一次 Routes 呼叫，不亂花。 */
/* 這趟旅程的時區。從匯入或手建的卡片不會有 utcOffsetMinutes，
   而拿手機的時區去換算會差一小時（台灣 +8、日本 +9），尖峰離峰剛好判反。
   同一趟旅程幾乎都在同一個時區，所以借用任何一張問過 Google 的卡片就夠了。 */
function tripOffset() {
  const all = S.cards || [];
  for (const c of all) {
    const p = c.data && c.data.place;
    if (p && p.utcOffsetMinutes != null) return p.utcOffsetMinutes;
  }
  return -(new Date().getTimezoneOffset());
}

/* 出發時刻交給 Routes API，開車才算得出那個時段的路況
   （edge function 收到 departureTime 就會把 routingPreference 開成 TRAFFIC_AWARE）。
   時區一定要用「地點自己的」utcOffsetMinutes：手機在台灣是 +8、日本是 +9，
   拿手機時區去換算會整整差一小時，尖峰離峰剛好判反。
   Routes API 不收過去的時間（TRANSIT 以外），過期就回 null 退回無路況模式。 */
function departISO(d, minutes, place) {
  if (minutes == null || !isFinite(minutes)) return null;
  let m = Math.round(minutes), extra = 0;
  while (m >= 1440) { m -= 1440; extra++; }        // 跨日的行程（深夜場）
  if (m < 0) return null;
  const ymd = dateAdd(dayDate(d), extra);
  const off = (place && place.utcOffsetMinutes != null) ? place.utcOffsetMinutes : tripOffset();
  const sign = off < 0 ? '-' : '+', ao = Math.abs(off);
  const iso = ymd + 'T' + pad2(Math.floor(m / 60)) + ':' + pad2(m % 60) + ':00'
            + sign + pad2(Math.floor(ao / 60)) + ':' + pad2(ao % 60);
  return new Date(iso).getTime() > Date.now() + 60000 ? iso : null;
}

async function ensureLegs(d, force) {
  if (!S.trip.autoRoute && !force) return;
  const list = dayCards(d);
  /* 先用現有（估的或舊的）路程排一次，拿到每一段的出發時刻。
     這是循環的——時刻依賴路程、路程又依賴時刻——但一輪就夠：
     路況造成的差是幾分鐘，不會把出發時段推到另一個尖峰去。 */
  const sched = computeSchedule(d);
  const departAtOf = {};
  sched.forEach(x => { departAtOf[x.card.id] = x.depart; });

  const jobs = [];
  for (let i = 0; i < list.length - 1; i++) {
    const a = list[i], b = list[i + 1];
    const pa = a.data.place, pb = b.data.place;
    if (!pa || !pb || pa.lat == null || pb.lat == null) continue;
    const mode = (a.data.leg && a.data.leg.mode) || S.trip.defaultMode || 'drive';
    const departAt = departISO(d, departAtOf[a.id], pa);
    /* 出發時刻只取到半小時，否則每動一下順序就整天重算。
       真正會改變路況的是「早上還是傍晚」，不是差那八分鐘。 */
    const slot = departAt ? departAt.slice(0, 13) + (departAt.slice(14, 16) < '30' ? 'A' : 'B') : '-';
    const sig = [pa.lat, pa.lng, pb.lat, pb.lng, mode, slot].join('|');
    if (!force && a.data.leg && a.data.leg.min != null && a.data.leg.sig === sig) continue;
    jobs.push({ card:a, sig, mode, departAt,
      origin:{ lat:pa.lat, lng:pa.lng }, destination:{ lat:pb.lat, lng:pb.lng } });
  }
  if (!jobs.length) return;
  try {
    const res = await gmap('route_batch', {
      legs: jobs.map(j => ({ origin:j.origin, destination:j.destination,
                             mode:j.mode, departAt:j.departAt || undefined })),
    });
    for (let i = 0; i < jobs.length; i++) {
      const r = res.legs[i]; if (!r || r.seconds == null) continue;
      jobs[i].card.data.leg = { mode:jobs[i].mode, min:Math.round(r.seconds / 60),
                                meters:r.meters, sig:jobs[i].sig, at:new Date().toISOString(),
                                traffic: !!jobs[i].departAt };
      await touch(jobs[i].card);
    }
    render();
  } catch (e) {
    if (e.code === 'NO_API_KEY') toast('路程要 Google API key 才算得出來，可先自己填');
    else toast(gmapMsg(e));
  }
}

/* 營業時間會變，而且卡片可能是手動建的、根本沒有。缺的就去問一次，
   不要倚賴資料庫裡原本存了什麼。沒有 API key 時整段靜默跳過，
   使用者仍然可以自己在編輯裡填。 */
/* 代理端的 parseMapsUrl 只認得 `?q=place_id:XXX` 這一種形式——
   `query_place_id=` 它讀不到（那是 Google 的 URL API 參數，不是搜尋參數）。
   以前用錯的形式，於是所有「帶 placeId 的重抓」都靜默落空、退回名稱搜尋；
   有 placeId 的卡片本來就有資料，所以一直沒被發現。 */
/* Google 回的地址頭尾都掛著國名：日文是「日本、〒980-…」、
   英文是「…Miyagi 980-0862日本」。在日本境內用不到，佔掉一整行寬度。 */
const tidyAddr = a => String(a || '')
  .replace(/^日本[、,]\s*/, '').replace(/[,、]?\s*日本$/, '').trim();
const pidUrl = pid => 'https://www.google.com/maps/search/?q=place_id:' + encodeURIComponent(pid);
const HOURS_TTL = 30 * 86400000;   // 一個月後重新問一次
async function ensureHours(d) {
  if (!S.trip || !navigator.onLine) return;
  const need = dayCards(d).filter(c => {
    const p = c.data.place;
    if (!p || (!p.placeId && !p.name)) return false;
    if (!p.hoursPeriods) return true;
    /* 地址與日文地址也算「缺料」。匯入的卡片這兩欄一直是空的，
       只看營業時間的話永遠不會被補上。 */
    if (!p.address || !p.addressJa) return true;
    return !p.hoursAt || (Date.now() - new Date(p.hoursAt).getTime()) > HOURS_TTL;
  }).slice(0, 6);                  // 一次最多問六個，別把額度一口氣吃掉
  if (!need.length) return;
  for (const c of need) {
    const p = c.data.place;
    try {
      const res = await gmap('resolve', p.placeId
        ? { url: pidUrl(p.placeId) }
        : { query: p.name, lat: p.lat, lng: p.lng });
      const np = res && res.place;
      if (!np) continue;
      p.hoursText = np.hoursText || p.hoursText;
      p.hoursPeriods = np.hoursPeriods || p.hoursPeriods;
      p.placeId = np.placeId || p.placeId;
      if (np.rating != null) { p.rating = np.rating; p.ratingCount = np.ratingCount; }
      if (np.utcOffsetMinutes != null) p.utcOffsetMinutes = np.utcOffsetMinutes;
      /* 匯入或手建的卡片從來沒有這些欄位——以前這裡只補營業時間，
         所以卡片展開後只看得到「營業」一項，地址電話全是空的。 */
      if (np.address && !p.address) p.address = np.address;
      if (np.phone && !p.phone) p.phone = np.phone;
      if (np.website && !p.website) p.website = np.website;
      if (np.mapsUri && !p.mapsUri) p.mapsUri = np.mapsUri;
      if (np.type && !p.type) p.type = np.type;
      /* 日文地址要另外問一次：Places 一次只回一種語言，
         而 zh-TW 拿到的是羅馬字（給人看），日文才是能貼進日規導航
         或拿給計程車司機看的那一種。只抓一次，之後永遠不再打。 */
      if (!p.addressJa && (np.placeId || p.placeId)) {
        try {
          const ja = await gmap('resolve', {
            url: pidUrl(np.placeId || p.placeId),
            lang: 'ja',
          });
          if (ja && ja.place) {
            p.addressJa = ja.place.address || null;
            p.nameJa = ja.place.name || null;
          }
        } catch (e) { /* 拿不到日文地址不是錯誤，其餘照常 */ }
      }
      p.hoursAt = new Date().toISOString();
      await touch(c);
    } catch (e) {
      if (e.code === 'NO_API_KEY') return;   // 沒設 key 就整批放棄，不要逐張報錯
    }
  }
  render();
}

/* ═══ 天氣（Open-Meteo，免 key） ════════════════════════════ */
const WCODE = { 0:'晴', 1:'大致晴', 2:'多雲時晴', 3:'陰', 45:'霧', 48:'霧淞',
  51:'毛毛雨', 53:'毛毛雨', 55:'毛毛雨', 61:'小雨', 63:'雨', 65:'大雨',
  71:'小雪', 73:'雪', 75:'大雪', 80:'陣雨', 81:'陣雨', 82:'強陣雨',
  95:'雷雨', 96:'雷雨冰雹', 99:'雷雨冰雹' };
async function loadWeather(d) {
  if (S.weather[d] !== undefined) return;
  const c = dayCards(d).find(x => x.data.place && x.data.place.lat != null);
  if (!c) { S.weather[d] = null; return; }
  const date = dayDate(d);
  /* 預報只到 16 天，更遠的日期回來會是空的——那就不顯示，不要編。
     但「什麼都不顯示」看起來像壞掉，所以記下「還太早」與哪天開始看得到，
     日首會直接寫出來。 */
  const diff = (new Date(date + 'T12:00:00') - new Date(todayISO() + 'T12:00:00')) / 86400000;
  if (diff > 15) { S.weather[d] = { tooFar: true, from: dateAdd(date, -15) }; return; }
  if (diff < 0) { S.weather[d] = null; return; }
  S.weather[d] = null;
  try {
    /* 一天一筆最高最低溫，對「下午三點在吾妻小富士會不會下雨」沒有幫助。
       同一支 API 就有逐時，多要三個欄位而已，成本一樣是零。 */
    const u = 'https://api.open-meteo.com/v1/forecast?latitude=' + c.data.place.lat +
      '&longitude=' + c.data.place.lng +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
      '&hourly=precipitation_probability,temperature_2m,weather_code' +
      '&timezone=auto&start_date=' + date + '&end_date=' + date;
    const j = await (await fetch(u)).json();
    if (j && j.daily && j.daily.time && j.daily.time.length) {
      S.weather[d] = { code:j.daily.weather_code[0],
        tmax:Math.round(j.daily.temperature_2m_max[0]),
        tmin:Math.round(j.daily.temperature_2m_min[0]) };
      if (j.hourly && j.hourly.time) {
        /* time 是 "2026-09-26T14:00" 這種本地時間字串，直接取小時當索引；
           不要丟給 Date 解析，那會被裝置時區再偏移一次。 */
        const byHour = {};
        j.hourly.time.forEach((t, i) => {
          const hh = parseInt(String(t).slice(11, 13), 10);
          if (!isFinite(hh)) return;
          byHour[hh] = { pop:j.hourly.precipitation_probability[i],
                         temp:j.hourly.temperature_2m[i],
                         code:j.hourly.weather_code[i] };
        });
        S.weatherH[d] = byHour;
      }
      render();
    }
  } catch (e) { /* 沒網路就算了，天氣不是主要功能 */ }
}
</script>

<script>
'use strict';
/* ═══ 旅程與卡片的寫入 ═══════════════════════════════════════ */
function tripMeta() {
  const t = S.trip;
  return { name:t.name, startDate:t.startDate, days:t.days, defaultStart:t.defaultStart,
           dayStarts:t.dayStarts, defaultMode:t.defaultMode, autoRoute:t.autoRoute, cats:t.cats };
}
async function saveTripLocal() { if (S.trip) await dbPut('trips', S.trip); }
async function touchMeta() { S.trip.dirtyMeta = true; await saveTripLocal(); scheduleSync(); }
async function touch(card) { card.dirty = true; await dbPut('cards', card); scheduleSync(); }

let syncDebounce = null;
function scheduleSync() {
  clearTimeout(syncDebounce);
  syncDebounce = setTimeout(() => syncNow(true), 1200);
}

function blankCard(dayIndex, data) {
  const list = dayCards(dayIndex);
  return {
    id: uuid(), trip: S.trip.code, dayIndex,
    orderKey: keyAfter(list.length ? list[list.length - 1].orderKey : ''),
    data: Object.assign({ name:'', catId:'', stayMin:60, pinTime:'', note:'',
                          links:[], todos:[], images:[], place:null, leg:null }, data || {}),
    rev:0, deleted:false, dirty:true, conflict:null,
    updatedBy: S.trip.nick || '', updatedAt: new Date().toISOString(),
  };
}
async function addCard(dayIndex, data) {
  const c = blankCard(dayIndex, data);
  S.cards.push(c);
  await dbPut('cards', c);
  scheduleSync();
  return c;
}
async function delCard(c) {
  c.deleted = true; c.dirty = true;
  await dbPut('cards', c);
  scheduleSync();
}
async function moveCard(c, dayIndex, beforeId) {
  const list = dayCards(dayIndex).filter(x => x.id !== c.id);
  let a = '', b = '';
  if (beforeId == null) { a = list.length ? list[list.length - 1].orderKey : ''; }
  else {
    const i = list.findIndex(x => x.id === beforeId);
    if (i >= 0) { a = i > 0 ? list[i - 1].orderKey : ''; b = list[i].orderKey; }
  }
  c.dayIndex = dayIndex;
  c.orderKey = keyBetween(a, b);
  await touch(c);
}

/* ═══ 進場畫面 ═══════════════════════════════════════════════ */
async function renderGate() {

  h += '<div class="panel"><h3>加入既有旅程</h3>' +
