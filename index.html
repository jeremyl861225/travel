       '</div><button class="btn fill wide" id="btnJoin" style="margin-top:9px">加入</button>' +
       '<p class="hint">代碼與密碼由建立旅程的人給你。內容在你手機上解密，' +
       '伺服器看不到行程內容。</p></div>';

  h += '<div class="panel"><h3>建立新旅程</h3>' +
       '<div class="fld stack"><span class="lab">名稱</span>' +
       '<input class="inp" id="newName" placeholder="例：京都五日"></div>' +
       '<div style="display:grid;grid-template-columns:minmax(0,1fr) 68px;gap:9px">' +
       '<div style="min-width:0"><span class="lab">出發日</span>' +
       '<input class="inp" id="newStart" type="date" value="' + todayISO() + '"></div>' +
       '<div style="min-width:0"><span class="lab">天數</span>' +
       '<input class="inp" id="newDays" type="number" min="1" max="60" value="5"></div></div>' +
       '<div class="fld stack" style="margin-top:12px"><span class="lab">密碼（共編用）</span>' +
       '<input class="inp" id="newPw" type="password" placeholder="至少 4 個字"></div>' +
       '<button class="btn fill wide" id="btnCreate">建立</button>' +
       '<p class="hint">密碼就是金鑰。忘記密碼＝這趟行程救不回來，' +
       '因為伺服器上只有密文，我們沒有備份。</p></div>';

  b.innerHTML = h;
  $$('[data-open]', b).forEach(n => n.onclick = () => askUnlock(n.dataset.open));
  $('#btnJoin').onclick = doJoin;
  $('#btnCreate').onclick = doCreate;
}
function tripState(t) {
  if (!t.startDate) return '未定日期';
  const end = dateAdd(t.startDate, (t.days || 1) - 1), today = todayISO();
  if (today < t.startDate) {
    const n = Math.round((new Date(t.startDate) - new Date(today)) / 86400000);
    return '還有 ' + n + ' 天';
  }
  if (today > end) return '已結束';
  return '進行中';
}

async function askUnlock(code) {
  const t = await dbGet('trips', code);
  if (!t) return;
  if (t.keyRaw) {
    try {
      S.trip = t;
      S.key = await crypto.subtle.importKey('raw', t.keyRaw, { name:'AES-GCM' }, true, ['encrypt','decrypt']);
      S.auth = t.authHash;
      return enterTrip();
    } catch (e) { /* 金鑰壞了就退回問密碼 */ }
  }
  openSheet('輸入密碼',
    '<div class="fld stack"><span class="lab">' + esc(t.name || t.code) + ' 的密碼</span>' +
    '<input class="inp" id="unlockPw" type="password" autofocus></div>' +
    '<label class="row" style="margin:10px 0 14px"><input type="checkbox" id="unlockRemember" checked> ' +
    '<span style="font-size:15px">記住這台裝置</span></label>' +
    '<button class="btn fill wide" id="unlockGo">開啟</button>' +
    '<p class="hint" id="unlockErr" style="color:var(--vermilion)"></p>',
    () => {
      $('#unlockGo').onclick = async () => {
        const pw = $('#unlockPw').value;
        try {
          const key = await deriveKey(pw, t.salt, t.iters);
          await decJSON(t.verifier, key);      // 密碼不對就會在這裡丟例外
          S.trip = t; S.key = key;
          S.auth = await authHash(t.code, pw, t.salt);
          t.authHash = S.auth;
          if ($('#unlockRemember').checked)
            t.keyRaw = await crypto.subtle.exportKey('raw', key);
          await dbPut('trips', t);
          closeSheet(); enterTrip();
        } catch (e) { $('#unlockErr').textContent = '密碼不對'; }
      };
      $('#unlockPw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#unlockGo').click(); });
    });
}

async function doCreate() {
  const name = $('#newName').value.trim() || '未命名旅程';
  const startDate = $('#newStart').value || todayISO();
  const days = clamp(parseInt($('#newDays').value, 10) || 5, 1, 60);
  const pw = $('#newPw').value;
  if (pw.length < 4) return toast('密碼至少 4 個字');
  const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
  const key = await deriveKey(pw, salt, CFG.iters);
  const verifier = await encJSON({ ok:'travel' }, key);
  const meta = { name, startDate, days, defaultStart:'08:30', dayStarts:{},
                 defaultMode:'drive', autoRoute:true, cats:DEFAULT_CATS.slice() };
  const metaEnc = await encJSON(meta, key);

  let code = '', ah = '', done = false;
  for (let i = 0; i < 5 && !done; i++) {
    code = newCode();
    ah = await authHash(code, pw, salt);
    try {
      await rpc('travel_create', { p_code:code, p_salt:salt, p_iters:CFG.iters,
        p_verifier:verifier, p_auth_hash:ah, p_meta:metaEnc });
      done = true;
    } catch (e) {
      if (!/CODE_TAKEN/.test(String(e.message))) {
        /* 連不上雲端也要能開始排行程：先在本機建，之後再推上去。 */
        done = true;
        toast('目前離線，旅程先建在這台裝置上');
      }
    }
  }
  const rec = Object.assign({ code, salt, iters:CFG.iters, verifier, authHash:ah,
    metaRev:1, dirtyMeta:false, lastPull:null, lastSync:null, nick:await kvGet('nick',''),
    keyRaw:await crypto.subtle.exportKey('raw', key), createdAt:new Date().toISOString() }, meta);
  await dbPut('trips', rec);
  S.trip = rec; S.key = key; S.auth = ah;
  enterTrip();
}

async function doJoin() {
  const code = $('#joinCode').value.trim().toUpperCase();
  const pw = $('#joinPw').value;
  if (!code || !pw) return toast('代碼與密碼都要填');
  try {
    const rows = await rpc('travel_salt', { p_code: code });
    const row = rows && rows[0];
    if (!row) return toast('找不到這個旅程代碼');
    const key = await deriveKey(pw, row.salt, row.iters);
    const ah = await authHash(code, pw, row.salt);
    let open = null;
    try { open = (await rpc('travel_open', { p_code:code, p_auth_hash:ah }))[0]; }
    catch (e) { return toast('密碼不對'); }
    await decJSON(open.verifier, key);
    const meta = await decJSON(open.meta, key);
    const rec = Object.assign({ code, salt:row.salt, iters:row.iters, verifier:open.verifier,
      authHash:ah, metaRev:open.meta_rev, dirtyMeta:false, lastPull:null, lastSync:null,
      nick:await kvGet('nick',''), keyRaw:await crypto.subtle.exportKey('raw', key),
      createdAt:new Date().toISOString() }, meta);
    await dbPut('trips', rec);
    S.trip = rec; S.key = key; S.auth = ah;
    enterTrip();
  } catch (e) { toast('加入失敗：' + (e.message || e).toString().slice(0, 80)); }
}

async function enterTrip() {
  S.cards = (await dbByTrip(S.trip.code)) || [];
  /* 現地重新基準只存在這台裝置，而且只在同一天有效——
     隔天再打開時昨天的「我在這裡」已經沒有意義了。 */
  const rb = await kvGet('rebase');
  S.rebase = (rb && rb.day === todayIndex() && rb.on === todayISO()) ? rb : null;
  if (rb && !S.rebase) await kvSet('rebase', null);
  const ti = todayIndex();
  S.day = ti >= 0 ? ti : 0;
  S.open = null;
  $('#gate').classList.remove('on');
  $('#app').classList.remove('hide');
  $('#dock').classList.remove('hide');
  render();
  startSyncLoop();
  syncNow(true);
  if (S.day >= 0) ensureHours(S.day);
  if (!S.trip.nick) askNick();
}
function leaveTrip() {
  clearInterval(syncTimer);
  S.trip = null; S.key = null; S.cards = []; S.weather = {};
  $('#app').classList.add('hide');
  $('#dock').classList.add('hide');
  applyBoard(HUES[0]);
  $('#gate').classList.add('on');
  renderGate();
}
function askNick() {
  openSheet('你是誰',
    '<p class="prose" style="margin-bottom:12px">同行的人會看到是誰改了哪一張卡片。</p>' +
    '<div class="fld stack"><span class="lab">暱稱</span>' +
    '<input class="inp" id="nickIn" placeholder="例：Jeremy" maxlength="12"></div>' +
    '<button class="btn fill wide" id="nickGo">好了</button>',
    () => { $('#nickGo').onclick = async () => {
      const v = $('#nickIn').value.trim() || '旅伴';
      S.trip.nick = v; await kvSet('nick', v); await saveTripLocal();
      closeSheet(); }; });
}
</script>

<script>
'use strict';
/* ═══ Google Maps 網址（不花錢，官方的 URL 格式） ═══════════ */
const GMODE = { drive:'driving', transit:'transit', walk:'walking', bicycle:'bicycling' };
const GBASE = 'https://www.google.com/maps/';

/* 用地名查，不要用座標——座標只會落一根圖釘，看不到營業時間、評論與照片。
   但 tohoku-2026 踩過的坑要一起帶著：**Google 查不到地名時不會報錯，
   會退回搜尋「使用者所在地附近的同類地點」**，實測過指到 2,239 km 外的案例。
   所以查詢字串的優先順序是：
     1. place.name — 從 Google 抓回來的正式名稱，或匯入時指定的查詢字串（tohoku 的 gq），
        這是最可靠的，因為它本來就是拿來查 Google 的
     2. 卡片顯示名稱 — 使用者自己打的，可能過於籠統（「滝の湯」會變成分類搜尋）
   兩者都沒有才退回座標。有 place_id 時一律附上，那是唯一精確的識別。 */
function gq(c) {
  if (!c) return '';
  const p = c.data.place || {};
  return String(p.name || c.data.name || '').trim();
}
function pt(c) {
  const q = gq(c);
  if (q) return encodeURIComponent(q);
  const p = c && c.data.place;
  return (p && p.lat != null) ? p.lat + ',' + p.lng : '';
}
/* 有沒有東西可以拿去開地圖：地名或座標，兩者有一就行。 */
function hasMap(c) {
  const p = (c && c.data.place) || {};
  return !!(gq(c) || (p.lat != null && p.lng != null));
}
function gmPlace(c) {
  const p = c.data.place || {};
  const q = gq(c);
  if (q) {
    return GBASE + 'search/?api=1&query=' + encodeURIComponent(q) +
           (p.placeId ? '&query_place_id=' + encodeURIComponent(p.placeId) : '');
  }
  if (p.lat != null && p.lng != null) return GBASE + 'search/?api=1&query=' + p.lat + ',' + p.lng;
  return GBASE + 'search/?api=1&query=';
}
/* 名稱解析錯了的逃生口：直接用座標開。放在卡片展開後的動作列。 */
function gmCoords(c) {
  const p = c.data.place || {};
  if (p.lat == null) return null;
  return GBASE + 'search/?api=1&query=' + p.lat + ',' + p.lng;
}
function gmDir(a, b, mode) {
  let u = GBASE + 'dir/?api=1&origin=' + pt(a) + '&destination=' + pt(b) +
          '&travelmode=' + (GMODE[mode] || 'driving');
  const pa = a.data.place, pb = b.data.place;
  if (pa && pa.placeId) u += '&origin_place_id=' + encodeURIComponent(pa.placeId);
  if (pb && pb.placeId) u += '&destination_place_id=' + encodeURIComponent(pb.placeId);
  return u;
}
function gmDay(list, mode) {
  if (list.length < 2) return null;
  /* Google 的 URL API 最多吃 9 個中途點，超過就只帶前 9 個。 */
  const mid = list.slice(1, -1).slice(0, 9);
  let u = GBASE + 'dir/?api=1&origin=' + pt(list[0]) +
          '&destination=' + pt(list[list.length - 1]) + '&travelmode=' + (GMODE[mode] || 'driving');
  if (mid.length) u += '&waypoints=' + mid.map(pt).join('%7C');
  return u;
}
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

/* ═══ 畫面 ═══════════════════════════════════════════════════ */
function render() {
  if (!S.trip) return;
  /* 色階要跟天數綁在一起：改天數的時候整條漸層要重新分配，
     不然加了一天之後最後一天就不是 L5 了。 */
  HUES = hueSet(S.trip.days || 1);
  $('#app').classList.toggle('edit', S.edit);
  applyBoard(hueOf(S.day));
  renderRail(); renderPlate(); renderSync();
}

function renderRail() {
  const r = $('#rail'); const days = S.trip.days || 1;
  let h = '';
  for (let i = 0; i < days; i++) {
    const n = dayCards(i).length;
    const dp = dateParts(dayDate(i));
    /* 已經翻過去的日子（在目前這一天之前）褪成極淺灰配白字。
       分頁鐵上一次只有一個「現在」，前面的是翻過的紙，
       維持原色會讓整條鐵尺看起來全部一樣重要。 */
    const past = S.day >= 0 && i < S.day;
    const bg = past ? PAST_TAB : hueOf(i);
    h += '<button class="tab' + (S.day === i ? ' on' : '') + (past ? ' past' : '') +
         '" data-day="' + i + '" ' +
         'style="background:' + bg + ';color:' + (past ? '#fff' : inkOn(hueOf(i))) +
         '" aria-label="第 ' + (i + 1) + ' 天">Day ' + (i + 1) +
         '<span class="td">' + dp.m + '/' + dp.d + '</span></button>';
  }
  /* 候選口袋跟其他分頁同一套規則與色票，用色輪的下一個顏色 */
  h += '<button class="tab cjk' + (S.day === -1 ? ' on' : '') + '" data-day="-1" ' +
       'style="background:' + POCKET_HUE + ';color:' + inkOn(POCKET_HUE) +
       '" aria-label="候選口袋">待' +
       '<span class="td">' + dayCards(-1).length + '</span></button>';
  r.innerHTML = h;
  $$('[data-day]', r).forEach(n => n.onclick = () => {
    S.day = parseInt(n.dataset.day, 10); S.open = null;
    render(); $('#plate').scrollTop = 0;
    if (S.day >= 0) { ensureLegs(S.day); loadWeather(S.day); ensureHours(S.day); }
  });
}

function leafHTML(r, i, flags) {
  const c = r.card, d = c.data;
  const cat = catBy(d.catId);
  const cls = 'leaf' + (flags.past ? ' past' : '');
  let meta = [];
  if (cat) meta.push(mark(cat.mark, 'sm') + '<span>' + esc(cat.name) + '</span>');
  const p = d.place || {};
  if (p.rating != null) meta.push('★ ' + p.rating + (p.ratingCount ? ' (' + p.ratingCount + ')' : ''));
  if (r.hours && r.hours.unknown === false && !r.hours.open) meta.push('到時沒開');
  /* 抵達那個小時的降雨機率。三成以下不顯示——那是雜訊，不是資訊。
     戶外行程（自然、展望）才提示，室內下不下雨無所謂。 */
  const wh = S.weatherH[c.dayIndex];
  if (wh && (d.catId === 'nature' || d.catId === 'view' || !d.catId)) {
    const hh = wh[Math.floor((r.arrive % 1440) / 60)];
    if (hh && hh.pop != null && hh.pop >= 30)
      meta.push('<span class="rainchip">☂ ' + hh.pop + '%</span>');
  }
  if (d.todos && d.todos.length) {
    const done = d.todos.filter(t => t.done).length;
    meta.push('預定 ' + done + '/' + d.todos.length);
  }

  let err = '';
  if (c.conflict) {
    err += '<div class="errata"><b>撞車</b><span>' + esc(c.conflict.by || '有人') +
           ' 在你之後也改了這張。<button class="btn" data-keep="' + c.id +
           '" style="border-color:#fff;color:#fff;min-height:26px;padding:2px 8px;margin:0 4px">保留我的</button>' +
           '<button class="btn" data-take="' + c.id +
           '" style="border-color:#fff;color:#fff;min-height:26px;padding:2px 8px">用對方的</button></span></div>';
  }
  /* 「遲」只在有釘選時間時才成立。現地重設也會把 late 填起來（它就是遲到量），
     但那張卡沒有釘選，印出來會變成「比釘選的 --:-- 慢了 26 分」。
     那一種由下面的「現」自己說明，不要在這裡重複又講錯。 */
  if (r.late > 0 && r.pin != null && !r.rebased)
    err += '<div class="errata"><b>遲</b><span>比釘選的 ' + min2hm(r.pin) + ' 慢了 ' +
           durTxt(r.late) + '，往後的時刻都已經順延。</span></div>';
  if (r.hours && r.hours.unknown === false && !r.hours.open)
    err += '<div class="errata"><b>休</b><span>' + min2hm(r.arrive) + ' 到的時候沒有營業。</span></div>';
  else if (r.leaveClosed)
    err += '<div class="errata warn"><b>關</b><span>停到 ' + min2hm(r.depart) +
           ' 時已經打烊，停留時間可能要縮短。</span></div>';
  if (r.lateEntry)
    err += '<div class="errata warn"><b>入</b><span>' + min2hm(r.lateEntry.limit) +
           ' 就停止入場（' + min2hm(r.lateEntry.close) + ' 閉館），' +
           min2hm(r.arrive) + ' 到會進不去。</span></div>';
  if (r.rebased)
    err += '<div class="errata warn"><b>現</b><span>這一站的時刻已改成你回報的 ' +
           min2hm(r.arrive) + '（' + (r.drift > 0 ? '比計畫慢 ' + durTxt(r.drift)
             : r.drift < 0 ? '比計畫快 ' + durTxt(-r.drift) : '剛好') +
           '），後面全部順延。<button class="btn" data-unrebase="1" ' +
           'style="border-color:currentColor;color:inherit;min-height:24px;padding:0 8px;margin-left:6px">取消</button></span></div>';

  return '<article class="' + cls + '" data-card="' + c.id + '">' +
    '<div class="lrow">' +
      '<div class="lmar" data-grip="' + c.id + '">' +
        '<div class="ltime">' + min2hm(r.arrive) + '</div>' +
        '<div class="lstay">停 ' + durMin(d.stayMin) + '</div>' +
        (d.pinTime ? '<div class="lstay pin">釘 ' + esc(d.pinTime) + '</div>' : '') +
        (S.edit ? '<span class="grip"></span>' : '') +
      '</div>' +
      '<div class="lbody" data-open="' + c.id + '">' +
        '<div style="min-width:0;flex:1">' +
          '<div class="lname">' + (esc(d.name) || '<span style="opacity:.6">未命名</span>') + '</div>' +
          (meta.length ? '<div class="lmeta">' + meta.join('<span class="sep">·</span>') + '</div>' : '') +
        '</div>' +
      '</div>' +
      /* 沒有地名也沒有座標就不放鍵——放了只會開到一張空白地圖。 */
      (hasMap(c) ? '<a class="lmap" href="' + gmPlace(c) + '" target="_blank" rel="noopener" ' +
        'aria-label="在 Google 地圖開啟">' + mark('map') + '</a>' : '<span class="lmap"></span>') +
    '</div>' + err +
    (S.open === c.id ? detailHTML(c, r) : '') +
  '</article>';
}

function detailHTML(c, r) {
  const d = c.data, p = d.place || {};
  let h = '<div class="detail">';
  /* 「我在這裡」擺在展開後的第一塊。它原本在最底下的動作列，
     要滑過介紹、營業時間、地址、連結才看得到——那是開車時要按的東西，
     埋在那個位置等於沒有。只有今天那一天才出現。 */
  if (c.dayIndex >= 0 && c.dayIndex === todayIndex())
    h += '<div class="blk full"><button class="btn fill wide" data-here="' + c.id + '">' +
         '我在這裡（把時刻改成現在）</button></div>';
  if (d.note)
    h += '<div class="blk full"><div class="prose">' +
         esc(d.note).replace(/\n/g, '<br>') + '</div></div>';
  if (p.hoursText && p.hoursText.length) {
    const w = dateParts(dayDate(c.dayIndex)).w;
    /* Google 給的順序是週一起算，本地的 getDay() 是週日起算，差一格。 */
    const idx = (w + 6) % 7;
    h += '<div class="blk"><span class="lab">營業</span><div class="hours">' +
      '<div class="today">' + esc(p.hoursText[idx] || p.hoursText[0]) +
      '<button class="btn" data-hours="' + c.id + '" style="min-height:22px;padding:1px 8px;' +
      'margin-left:8px;font-size:10px">全部</button></div>' +
      '<div class="hidden-hours hide">' +
      p.hoursText.map((s, i) => i === idx ? '' : '<div>' + esc(s) + '</div>').join('') +
      '</div></div></div>';
  }
  if (p.address || p.addressJa || p.phone || p.website || d.mapcode) {
    h += '<div class="blk"><span class="lab">地點</span><div>';
    /* 日文地址擺第一：那是唯一能貼進日規導航、或直接拿給司機看的形式。
       羅馬字地址擺第二，給看不懂漢字的旅伴用。 */
    const ja = tidyAddr(p.addressJa), en = tidyAddr(p.address);
    if (ja)
      h += '<div class="addr"><span class="addrlab">日</span>' +
           '<span class="addrtxt">' + esc(ja) + '</span>' +
           '<button class="btn addrcopy" data-copy="' + esc(ja) + '">複製</button></div>';
    if (en)
      h += '<div class="addr"><span class="addrlab">英</span>' +
           '<span class="addrtxt">' + esc(en) + '</span>' +
           '<button class="btn addrcopy" data-copy="' + esc(en) + '">複製</button></div>';
    if (p.nameJa && p.nameJa !== d.name)
      h += '<div class="addr"><span class="addrlab">名</span>' +
           '<span class="addrtxt">' + esc(p.nameJa) + '</span>' +
           '<button class="btn addrcopy" data-copy="' + esc(p.nameJa) + '">複製</button></div>';
    if (d.mapcode)
      h += '<div class="addr"><span class="addrlab">M</span>' +
           '<span class="addrtxt">' + esc(d.mapcode) + '</span>' +
           '<button class="btn addrcopy" data-copy="' + esc(d.mapcode) + '">複製</button></div>';
    if (p.phone)
      h += '<div class="addr"><span class="addrlab">話</span>' +
           '<a class="linkline addrtxt" href="tel:' + esc(p.phone.replace(/\s/g, '')) + '">' +
           esc(p.phone) + '</a>' +
           '<button class="btn addrcopy" data-copy="' + esc(p.phone) + '">複製</button></div>';
    h += '</div></div>';
  }
  if (d.links && d.links.length) {
    h += '<div class="blk"><span class="lab">連結</span><div>' +
      d.links.map(l => '<a class="linkline" href="' + esc(l.url) + '" target="_blank" rel="noopener">→ ' +
        esc(l.label || l.url) + '</a>').join('') + '</div></div>';
  }
  if (p.website)
    h += '<div class="blk"><span class="lab">官網</span><div><a class="linkline" href="' +
         esc(p.website) + '" target="_blank" rel="noopener">→ ' + esc(p.website) + '</a></div></div>';
  if (d.todos && d.todos.length) {
    h += '<div class="blk"><span class="lab">預定</span><div>' +
      d.todos.map(t => '<div class="todo' + (t.done ? ' done' : '') + '">' +
        '<button class="punch' + (t.done ? ' on' : '') + '" data-todo="' + c.id + '|' + t.id + '" ' +
        'aria-label="完成"></button><span class="t">' + esc(t.text) + '</span></div>').join('') +
      '</div></div>';
  }
  if (d.images && d.images.length) {
    h += '<div class="blk"><span class="lab">圖片</span><div class="imgs">' +
      d.images.map(u => '<img src="' + esc(u) + '" alt="" loading="lazy">').join('') + '</div></div>';
  }
  const isStay = d.catId === 'stay' || (catBy(d.catId) && catBy(d.catId).mark === 'stay');
  h += '<div class="blk full"><div class="row">' +
    '<button class="btn" data-edit="' + c.id + '">編輯</button>' +
    /* 旅途中用的：報一次「我現在人在這裡」，剩下的整天當場重推。
       只有今天那一天才給——對其他天按它沒有意義。 */
    (c.dayIndex < 0 ? '<button class="btn" data-bestday="' + c.id + '">排進哪一天？</button>' : '') +
    '<a class="btn" href="' + gmPlace(c) + '" target="_blank" rel="noopener">' + mark('pin','sm') + ' 地圖</a>' +
    (!(d.place && d.place.placeId) && gmCoords(c)
      ? '<a class="btn" href="' + gmCoords(c) + '" target="_blank" rel="noopener" ' +
        'title="地名查錯時用這個">用座標開</a>' : '') +
    (isStay && c.dayIndex >= 0 ? '<button class="btn" data-dup="' + c.id + '">複製到隔天開頭</button>' : '') +
    '</div></div>';
  return h + '</div>';
}

function renderPlate() {
  const plate = $('#plate');
  const d = S.day;
  const sched = d >= 0 ? computeSchedule(d) : dayCards(-1).map(c => ({ card:c, arrive:null, depart:null, late:0, hours:{unknown:true} }));
  S.sched = sched;
  const ti = todayIndex();
  const isToday = d === ti;
  let topIdx = -1;
  if (d >= 0) {
    if (isToday) { const n = nowMin(); topIdx = sched.findIndex(r => r.depart > n); }
    else if (ti < 0 || d > ti) topIdx = 0;
  }

  let h = '';
  if (d >= 0) {
    const dp = dateParts(dayDate(d));
    const w = S.weather[d];
    const firstPin = sched.find(r => r.pinTarget != null);
    const list = dayCards(d);
    const dayUrl = gmDay(list.filter(c => gq(c) || (c.data.place && c.data.place.lat != null)),
                         S.trip.defaultMode);
    h += '<div class="head"><div class="headtop">' +
      '<button class="backb" id="btnHome" aria-label="回旅程列表">' + mark('back','sm') + '</button>' +
      '<span class="trip">' + esc(S.trip.name) + '</span></div>' +
      '<div class="headmain"><div class="headmar">' +
        '<div class="dnum">DAY</div><div class="dbig">' + (d + 1) + '</div></div>' +
      '<div class="headbody">' +
        /* 數字走 Avenir Next（跟時刻同一支），中文才走明體。
           不分開的話日期會用壓縮體的數字，跟卡片上的時刻長得不一樣。 */
        '<div class="ddate"><span class="num">' + dp.m + '</span> 月 <span class="num">' +
          dp.d + '</span> 日<span style="font-size:15px;color:var(--ink2)"> 週' +
          WEEK[dp.w] + '</span></div>' +
        (w && w.tooFar
          ? '<div class="dsub">天氣　' + (() => { const q = dateParts(w.from);
              return q.m + '/' + q.d; })() + ' 起看得到（預報只到 16 天）</div>'
          : w ? '<div class="dsub">' + (WCODE[w.code] || '') + ' ' + w.tmin + '–' + w.tmax + '°C</div>' : '') +
        /* 公休與撲空要在日首就看得到。點進每一張卡才發現「今天週一休館」
           已經太晚了——那是要換天的決定，不是換時間的決定。 */
        /* 今天：直接講「現在應該在哪」。行程表最沒用的時刻，
           就是你人在路上卻要自己拿手指去比對哪一列。 */
        (() => {
          if (d !== ti || !sched.length) return '';
          const n = nowMin();
          const at = sched.find(x => n >= x.arrive && n < x.depart);
          if (at) return '<div class="dsub" style="color:var(--accent-line)">現在 ' +
            min2hm(n) + '　應該在 <b>' + esc(at.card.data.name || '') + '</b>，還有 ' +
            durTxt(at.depart - n) + '</div>';
          const nx = sched.find(x => x.arrive > n);
          if (nx) return '<div class="dsub" style="color:var(--accent-line)">現在 ' +
            min2hm(n) + '　在往 <b>' + esc(nx.card.data.name || '') + '</b> 的路上，' +
            durTxt(nx.arrive - n) + '後到</div>';
          return '<div class="dsub">今天的行程已經結束</div>';
        })() +
        (() => {
          const shut = sched.filter(x => x.hours && x.hours.unknown === false && !x.hours.open).length;
          const off = list.filter(c => {
            const per = c.data.place && c.data.place.hoursPeriods;
            return per && closedAllDay(per, dp.w);
          }).length;
          if (!shut && !off) return '';
          const bits = [];
          if (off) bits.push(off + ' 站今天公休');
          if (shut) bits.push(shut + ' 站到的時候沒開');
          return '<div class="dsub" style="color:var(--vermilion)">' + bits.join('　') + '</div>';
        })() +
        (firstPin ? '<div class="dsub" style="color:' + (firstPin.pinDrift > 0 ? 'var(--vermilion)' : 'var(--ink)') + '">' +
          '距 ' + min2hm(firstPin.pinTarget) + ' ' + esc(firstPin.pinName) + '：' +
          (firstPin.pinDrift > 0 ? '已慢 ' + durTxt(firstPin.pinDrift) : '尚有餘裕 ' + durTxt(-firstPin.pinDrift)) +
          '</div>' : '') +
        dayStrip(sched, d) +
      '</div></div>' +
      /* 動作列是「這一天」的，不是「日期文字」的，所以拉出文字欄、
         跟 DAY 方塊的左緣切齊，整張卡等寬。 */
      '<div class="startrow">' +
        '<button class="btn fill" id="btnStart">出發 ' + dayStart(d) + '</button>' +
        (S.edit ? '<button class="btn fill" id="btnPlan">排順路</button>' : '') +
        (dayUrl ? '<a class="btn fill" href="' + dayUrl + '" target="_blank" rel="noopener">Map' +
          mark('ext','xs') + '</a>' : '') +
      '</div>' +
      '</div>';
  } else {
    h += '<div class="head"><div class="headtop">' +
      '<button class="backb" id="btnHome" aria-label="回旅程列表">' + mark('back','sm') + '</button>' +
      '<span class="trip">' + esc(S.trip.name) + '</span></div>' +
      '<div class="headmain"><div class="headmar"><div class="dnum">POCKET</div>' +
      '<div class="dbig">' + dayCards(-1).length + '</div></div><div class="headbody">' +
      '<div class="ddate">候選口袋</div>' +
      '<div class="dsub">想去但還沒排進哪一天的地方。按住左邊的時刻欄可以拖動順序，' +
      '要換到某一天用卡片裡的「移到…」。</div>' +
      '<div class="startrow"><button class="btn fill" id="btnNear">找附近</button></div>' +
      '</div></div></div>';
  }

  if (!sched.length) {
    h += '<div class="leaf empty">' +
      '<div class="lname">' + (d >= 0 ? '這一天還是空的。' : '口袋是空的。') + '</div>' +
      '<p>從 Google 地圖分享一個地點，貼進「＋ 新增」就會自己長出地址與營業時間。</p>' +
      '</div>';
  }

  sched.forEach((r, i) => {
    const past = d >= 0 && (d < ti || (isToday && topIdx >= 0 && i < topIdx) || (isToday && topIdx < 0));
    h += leafHTML(r, i, { past });
    if (i < sched.length - 1 && d >= 0) {
      const c = r.card, nx = sched[i + 1].card;
      const leg = r.leg || {};
      const m = modeBy(leg.mode || S.trip.defaultMode);
      const gap = sched[i + 1].wait;
      /* 兩站座標完全相同時，Google 會誠實回 0 分——看起來卻像功能壞了。
         把原因寫出來：不是算不出來，是這兩張卡指到同一個點。 */
      const pa = c.data.place, pb = nx.data.place;
      const samePoint = pa && pb && pa.lat != null && pb.lat != null &&
                        pa.lat === pb.lat && pa.lng === pb.lng;
      const body = mark(m.mark, 'sm') + (leg.min == null ? '<span>路程未知</span>' :
        (leg.est ? '<span class="est">約</span>' : '') +
        '<b>' + leg.min + ' 分</b>' + (leg.meters ? '<span>' + dist(leg.meters) + '</span>' : '')) +
        (gap > 20 ? '<span class="gap">空檔 ' + durTxt(gap) + '</span>' : '') +
        /* 連開九十分鐘以上要休息。行程表本來完全沒有休息的概念，
           而這趟最長的一段是九十九分鐘。 */
        ((leg.min != null && leg.min >= 90 && (leg.mode || S.trip.defaultMode) === 'drive')
          ? '<span class="longdrive">連續開車，中途找地方休息</span>' : '') +
        (samePoint ? '<span class="longdrive">兩張卡是同一個座標</span>' : '');
      /* 平常點下去就是開 Google 路線；編輯模式才是改這一段的數字與交通方式。 */
      h += '<div class="hinge">' + (S.edit
        ? '<button class="leg' + (leg.min == null ? ' miss' : '') + '" data-leg="' + c.id + '">' +
            body + '<span class="legedit">改</span></button>'
        : '<a class="leg' + (leg.min == null ? ' miss' : '') + '" href="' +
            gmDir(c, nx, leg.mode || S.trip.defaultMode) + '" target="_blank" rel="noopener">' +
            body + '</a>') + '</div>';
    }
  });

  plate.innerHTML = h;
  bindPlate();
}

/* ═══ 路程估算（程式端，不進資料庫） ══════════════════════════
   路程是「兩張卡的相對位置」推出來的結果，不是卡片自己的屬性——
   順序一改它就失效。所以估算放在這裡即時算，資料庫只存真正量到的值
   （Google 算的或使用者手填的），而且只在那一對仍然相鄰時才採用。

   係數是拿 tohoku-2026 的實測車程校準出來的，不是猜的：
   24 段裡濾掉 10 段配對有問題的，剩 14 段乾淨的自駕段，
   直線距離 × 1.58 ＝ 實際路程，平均時速 64 km/h。
   誤差中位數 6.6 分、最大 20 分——夠用來排順序與抓大概，
   但不能當成準確的到達時刻。所以估算值一律標「約」。 */
const LEG_MODEL = {
  drive:   { detour: 1.58, kmh: 64, overhead: 4 },   // overhead：停車、上下車
  transit: { detour: 1.45, kmh: 32, overhead: 10 },  // overhead：等車
  walk:    { detour: 1.25, kmh: 4.6, overhead: 1 },
  bicycle: { detour: 1.30, kmh: 13, overhead: 2 },
};
function estimateLeg(a, b, mode) {
  const pa = a && a.data.place, pb = b && b.data.place;
  if (!pa || !pb || pa.lat == null || pb.lat == null) return null;
  const m = LEG_MODEL[mode] || LEG_MODEL.drive;
  const straight = haversine([pa.lat, pa.lng], [pb.lat, pb.lng]);
  const road = straight * m.detour;
  const min = Math.round(road / 1000 / m.kmh * 60 + m.overhead);
  return { mode, min: Math.max(1, min), meters: Math.round(road), est: true };
}
/* 這一段目前該顯示什麼：量到的值只有在那一對仍然相鄰時才算數，
   否則一律回退到即時估算。 */
function legOf(a, b) {
  const stored = a.data.leg;
  const mode = (stored && stored.mode) || (S.trip && S.trip.defaultMode) || 'drive';
  if (stored && stored.min != null) {
    const pa = a.data.place, pb = b && b.data.place;
    const sig = (pa && pb && pa.lat != null && pb.lat != null)
      ? [pa.lat, pa.lng, pb.lat, pb.lng, mode].join('|') : null;
    /* sig 對得上＝這一對沒被動過；'tohoku' 與 'manual' 是外部帶進來或手填的，
       只要兩端座標沒變就繼續採用。
       sig 後面還會接一段出發時段（路況用），所以是比前綴不是比全等——
       時段換了值仍然可用，只是下次 ensureLegs 會去要一份新的。 */
    if (!stored.sig || stored.sig === 'tohoku' || stored.sig === 'manual' ||
        (sig && (stored.sig === sig || stored.sig.indexOf(sig + '|') === 0))) {
      return stored;
    }
  }
  return estimateLeg(a, b, mode);
}

/* ═══ 自動排順路 ═══════════════════════════════════════════
   這是旅行推銷員問題。直接對整天做 TSP 會產生垃圾結果，因為行程不是
   一組可以任意交換的點——所以這裡有四個「不准動」的錨點：
     1. 當天第一站（通常是住宿或前一天的終點，動了整天就錯了）
     2. 所有釘選時間的卡（餐廳訂位、預約制景點，順序由時間決定）
     3. 沒有座標的卡（算不出距離，不能假裝它可以移動）
     4. 當天最後一站（通常是住宿）
   只有錨點與錨點之間那幾段自由的卡會被重排。
   成本用直線距離，不是實際路程——沒有 API key 時無法取得所有點對的
   真實車程（8 站就是 56 組），而且那要另外計費。直線距離對「決定順序」
   夠用，但山路、跨河、單行道會失準，所以結果一定要先給人看過再套用。
   **不考慮營業時間與停留時間**，重排後可能把某站排到它沒開門的時段。 */
function haversine(a, b) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
  const h = Math.sin(dLat/2) ** 2 +
            Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng/2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
/* 兩兩之間的真實車程。一次 computeRouteMatrix 就換回整張 N×N，
   比逐段打 computeRoutes 便宜。拿不到（沒 key、超過 14 站、走不通）就回 null，
   呼叫端會退回直線估算，而不是假裝有資料。 */
const MATRIX_TTL = 6 * 3600000;
async function dayMatrix(d, list, cacheKey) {
  const idx = [], pts = [];
  list.forEach((c, i) => {
    const p = c.data.place;
    if (p && p.lat != null && p.lng != null) { idx.push(i); pts.push({ lat: p.lat, lng: p.lng }); }
  });
  if (pts.length < 2 || pts.length > 14) return null;
  const mode = (S.trip && S.trip.defaultMode) || 'drive';
  const sig = pts.map(p => p.lat.toFixed(4) + ',' + p.lng.toFixed(4)).join(';') + '|' + mode;
  const key = cacheKey == null ? 'd' + d : cacheKey;
  const hit = S.matrix && S.matrix[key];
  if (hit && hit.sig === sig && Date.now() - hit.at < MATRIX_TTL) return hit;
  try {
    const departAt = departISO(d, hm2min(dayStart(d)), list[idx[0]] && list[idx[0]].data.place);
    const m = await gmap('matrix', { points: pts, mode, departAt: departAt || undefined });
    /* 矩陣是以「有座標的那幾張」為序的，要換回 list 的索引，
       否則沒有座標的卡一插進來，所有格子就對錯人了。 */
    const pos = {}; idx.forEach((li, k) => { pos[li] = k; });
    const out = { sig, at: Date.now(), pos, seconds: m.seconds, meters: m.meters };
    S.matrix = S.matrix || {}; S.matrix[key] = out;
    return out;
  } catch (e) {
    return null;
  }
}

/* 成本＝分鐘。有真實矩陣就用，沒有就用校準過的直線模型。
   單位統一成分鐘，因為營業時間是用分鐘在比的。 */
function makeCost(list, pt, mx) {
  return (i, j) => {
    if (mx && mx.pos[i] != null && mx.pos[j] != null) {
      const v = mx.seconds[mx.pos[i]][mx.pos[j]];
      if (v != null) return v / 60;
    }
    const a = pt[i], b = pt[j];
    if (!a || !b) return 0;
    const mode = (list[i].data.leg && list[i].data.leg.mode) || (S.trip && S.trip.defaultMode) || 'drive';
    const m = LEG_MODEL[mode] || LEG_MODEL.drive;
    return m.overhead + haversine(a, b) * m.detour / 1000 / m.kmh * 60;
  };
}
function makeDist(list, pt, mx) {
  return (i, j) => {
    if (mx && mx.pos[i] != null && mx.pos[j] != null) {
      const v = mx.meters[mx.pos[i]][mx.pos[j]];
      if (v != null) return v;
    }
    const a = pt[i], b = pt[j];
    if (!a || !b) return 0;
    const mode = (list[i].data.leg && list[i].data.leg.mode) || (S.trip && S.trip.defaultMode) || 'drive';
    return haversine(a, b) * ((LEG_MODEL[mode] || LEG_MODEL.drive).detour);
  };
}

/* 給一個順序打分。這是整個排順路的核心：
   不是只算路程，而是把時刻推一遍，看有幾站到的時候沒開門。
   營業時間因此是「約束」而不是「排完再檢查」——順序在被選中之前
   就已經因為撲空而被淘汰了。
   排序準則：撲空站數 → 收工時間 → 純移動時間。
   用收工時間而不是移動時間當第二順位，是因為「為了等開門而枯等」
   跟「多開二十分鐘」對旅人的代價是一樣的，都要算進去。 */
function scoreOrder(list, order, d, cost) {
  const dp = dateParts(dayDate(d));
  let t = hm2min(dayStart(d)); if (t == null) t = 540;
  let travel = 0, shut = 0, wait = 0, end = t;
  for (let k = 0; k < order.length; k++) {
    const c = list[order[k]];
    const pin = hm2min(c.data.pinTime);
    const arrive = (pin != null && pin >= t) ? pin : t;
    wait += arrive - t;
    const per = c.data.place && c.data.place.hoursPeriods;
    if (per) { const o = isOpenAt(per, dp.w, arrive); if (!o.unknown && !o.open) shut++; }
    const depart = arrive + (Number(c.data.stayMin) || 0);
    end = depart;
    if (k < order.length - 1) {
      const leg = cost(order[k], order[k + 1]);
      travel += leg;
      t = depart + leg;
    }
  }
  return { shut, end, travel, wait };
}
const scoreBetter = (a, b) =>
  a.shut !== b.shut ? a.shut < b.shut :
  Math.round(a.end) !== Math.round(b.end) ? a.end < b.end :
  a.travel < b.travel - 0.2;

/* 局部搜尋：對調兩張自由卡、或把一張抽出來插到另一個自由位置，
   只要分數變好就採用。錨點的「位置」永遠不變，所以第一站、最後一站、
   釘選卡、沒座標的卡都待在原地。
   n 最多十幾，每輪 O(n²) 次評分、每次評分 O(n)，跑滿也是幾千次運算，
   在手機上是瞬間的事——不需要 2-opt 那種只看幾何的近似。 */
function searchOrder(list, before, anchor, d, cost) {
  const freePos = before.filter(i => !anchor[i]);
  if (freePos.length < 2) return before.slice();
  let cur = before.slice(), best = scoreOrder(list, cur, d, cost);
  let improved = true, guard = 0;
  const apply = (items) => {
    const t = cur.slice();
    freePos.forEach((p, i) => { t[p] = items[i]; });
    return t;
  };
  while (improved && guard++ < 40) {
    improved = false;
    for (let x = 0; x < freePos.length; x++) {
      for (let y = x + 1; y < freePos.length; y++) {
        const items = freePos.map(p => cur[p]);
        const t1 = items.slice(); const tmp = t1[x]; t1[x] = t1[y]; t1[y] = tmp;
        const c1 = apply(t1), s1 = scoreOrder(list, c1, d, cost);
        if (scoreBetter(s1, best)) { cur = c1; best = s1; improved = true; continue; }
        const t2 = items.slice(); const [mv] = t2.splice(x, 1); t2.splice(y, 0, mv);
        const c2 = apply(t2), s2 = scoreOrder(list, c2, d, cost);
        if (scoreBetter(s2, best)) { cur = c2; best = s2; improved = true; }
      }
    }
  }
  return cur;
}

function planDay(d, mx) {
  const list = dayCards(d);
  if (list.length < 4) return null;                  // 三站以內沒有重排的餘地
  const pt = list.map(c => {
    const p = c.data.place;
    return (p && p.lat != null && p.lng != null) ? [p.lat, p.lng] : null;
  });
  const anchor = list.map((c, i) =>
    i === 0 || i === list.length - 1 || !!c.data.pinTime || !pt[i]);
  const before = list.map((_, i) => i);
  const cost = makeCost(list, pt, mx);
  const distOf = makeDist(list, pt, mx);
  const after = searchOrder(list, before, anchor, d, cost);
  const km = o => { let t = 0; for (let i = 1; i < o.length; i++) t += distOf(o[i-1], o[i]); return t; };
  return { list, pt, before, after, anchor, mx: !!mx,
           scoreBefore: scoreOrder(list, before, d, cost),
           scoreAfter: scoreOrder(list, after, d, cost),
           lenBefore: km(before), lenAfter: km(after),
           movable: anchor.filter(a => !a).length,
           changed: after.some((v, i) => v !== before[i]) };
}

/* ── Google 的排程器 ────────────────────────────────────────
   Route Optimization API 解的是帶時間窗的車輛途程問題：營業時間是
   時間窗、停留時間是服務時間、釘選是被壓成一個點的時間窗。
   它跟本地解算器的差別不在「會不會排」，而在「釘選的卡也能被搬動」——
   本地版把釘選當錨點釘死在原位，這一支會把它移到時間允許的任何位置。

   它不收 API key，只收 OAuth（服務帳戶）。沒設 GOOGLE_SA_KEY 就
   回 NO_SA_KEY，介面照舊、只是少一顆按鈕。 */
function hoursWindow(c, d) {
  const per = c.data.place && c.data.place.hoursPeriods;
  if (!per || !per.length) return null;
  if (per.length === 1 && !per[0].close) return null;         // 24 小時，不必設限
  const w = dateParts(dayDate(d)).w;
  const hit = per.filter(x => x.open && x.open.day === w);
  if (!hit.length) return 'CLOSED';
  return hit.map(x => {
    const o = x.open.hour * 60 + (x.open.minute || 0);
    let cl = x.close ? x.close.hour * 60 + (x.close.minute || 0) : 1439;
    if (x.close && x.close.day !== x.open.day) cl += 1440;    // 跨夜
    return [o, cl];
  });
}
async function optimizeDay(d) {
  const list = dayCards(d);
  if (list.length < 4) throw Object.assign(new Error('too few'), { code: 'TOO_FEW' });
  const withPt = list.map(c => c.data.place && c.data.place.lat != null);
  if (!withPt[0] || !withPt[list.length - 1])
    throw Object.assign(new Error('no ends'), { code: 'NO_ENDS' });

  const startMin = hm2min(dayStart(d)) ?? 540;
  const ref = list[0].data.place;
  const T = m => departISO(d, m, ref);
  const gStart = T(startMin), gEnd = T(startMin + 16 * 60);
  if (!gStart || !gEnd)
    throw Object.assign(new Error('past'), { code: 'PAST_DATE' });

  const mid = [], skipped = [], closed = [];
  for (let i = 1; i < list.length - 1; i++) {
    const c = list[i];
    if (!withPt[i]) { skipped.push(c.data.name || '未命名'); continue; }
    const win = hoursWindow(c, d);
    if (win === 'CLOSED') closed.push(c.data.name || '未命名');
    const p = c.data.place;
    const del = {
      arrivalWaypoint: { location: { latLng: { latitude: p.lat, longitude: p.lng } } },
      duration: Math.max(60, (Number(c.data.stayMin) || 0) * 60) + 's',
    };
    const pin = hm2min(c.data.pinTime);
    if (pin != null) {
      // 釘選＝把時間窗壓成一個點，讓解算器沒有別的選擇。
      del.timeWindows = [{ startTime: T(pin), endTime: T(pin) }];
    } else if (Array.isArray(win)) {
      del.timeWindows = win
        .map(([o, cl]) => ({ startTime: T(o), endTime: T(Math.min(cl, startMin + 16 * 60)) }))
        .filter(x => x.startTime && x.endTime);
    }
    mid.push({ card: c, shipment: { label: c.id, deliveries: [del] } });
  }
  if (mid.length < 2) throw Object.assign(new Error('nothing to move'), { code: 'NO_MOVABLE' });

  const first = list[0].data.place, last = list[list.length - 1].data.place;
  const model = {
    globalStartTime: gStart,
    globalEndTime: gEnd,
    shipments: mid.map(x => x.shipment),
    vehicles: [{
      startWaypoint: { location: { latLng: { latitude: first.lat, longitude: first.lng } } },
      endWaypoint: { location: { latLng: { latitude: last.lat, longitude: last.lng } } },
      startTimeWindows: [{ startTime: T(startMin + (Number(list[0].data.stayMin) || 0)) }],
      travelMode: (S.trip.defaultMode === 'walk') ? 'WALKING' : 'DRIVING',
      costPerHour: 60,
    }],
  };
  const res = await gmap('optimize', { model });
  const route = (res.routes || [])[0];
  if (!route || !route.visits) throw Object.assign(new Error('no route'), { code: 'NO_SOLUTION' });
  const seq = route.visits
    .slice()
    .sort((a, b) => String(a.startTime || '').localeCompare(String(b.startTime || '')))
    .map(v => mid[v.shipmentIndex || 0])
    .filter(Boolean);
  /* 解不進去的貨件不會出現在 visits 裡。少了幾張就照舊套用的話，
     那幾張會留在舊的 orderKey 上，位置變得無法預測——寧可整個不給套。 */
  if (seq.length !== mid.length) {
    const got = new Set(seq.map(x => x.card.id));
    const lost = mid.filter(x => !got.has(x.card.id)).map(x => x.card.data.name || '未命名');
    throw Object.assign(new Error('unassigned'), { code: 'UNASSIGNED', lost });
  }
  /* 沒有座標的卡沒進模型，把它們補回原來的相對位置（接在最後一站之前），
     不然套用順序時會整批消失。 */
  const order = [0]
    .concat(seq.map(x => list.indexOf(x.card)))
    .concat(list.map((_, i) => i).filter(i => i > 0 && i < list.length - 1 && !withPt[i]))
    .concat([list.length - 1]);
  return { list, order, skipped, closed,
           visits: route.visits.length, metrics: route.metrics || null };
}

/* 口袋裡的卡要排進哪一天？對每一天試算「插在哪個位置最省」，
   再把六天排名。用的是跟排順路同一套：真實路網矩陣＋營業時間約束。
   第一站與最後一站不動（通常是住宿或機場），所以只試中間的位置。 */
async function sheetBestDay(id) {
  const card = (S.cards || []).find(c => c.id === id);
  if (!card) return;
  const p = card.data.place;
  if (!p || p.lat == null) return toast('這張卡沒有座標，算不出插在哪裡最划算');

  toast('正在對每一天各試算一次…', 6000);
  const rows = [];
  for (let d = 0; d < S.trip.days; d++) {
    const base = dayCards(d);
    if (base.length < 2) continue;
    const full = base.concat([card]);
    const cand = full.length - 1;
    const mx = await dayMatrix(d, full, 'try' + d);
    const pt = full.map(c => {
      const q = c.data.place;
      return (q && q.lat != null) ? [q.lat, q.lng] : null;
    });
    const cost = makeCost(full, pt, mx);
    const baseOrder = base.map((_, i) => i);
    const before = scoreOrder(full, baseOrder, d, cost);
    let best = null;
    for (let k = 1; k < base.length; k++) {
      const order = baseOrder.slice(0, k).concat([cand], baseOrder.slice(k));
      const sc = scoreOrder(full, order, d, cost);
      if (!best || scoreBetter(sc, best.sc)) best = { k, sc };
    }
    if (!best) continue;
    rows.push({ d, before, after: best.sc, at: best.k, beforeId: base[best.k].id,
                afterName: base[best.k - 1].data.name, mx: !!mx });
  }
  if (!rows.length) return toast('沒有哪一天有兩站以上，插不進去');
  rows.sort((a, b) =>
    (a.after.shut - a.before.shut) - (b.after.shut - b.before.shut) ||
    (a.after.end - a.before.end) - (b.after.end - b.before.end));

  const body = rows.map((r, i) => {
    const dEnd = r.after.end - r.before.end;
    const dShut = r.after.shut - r.before.shut;
    const dp = dateParts(dayDate(r.d));
    return '<div class="todo"><span class="t">' +
      '<b>第 ' + (r.d + 1) + ' 天</b>　' + dp.m + '/' + dp.d + '　接在「' +
      esc(r.afterName || '第一站') + '」後面' +
      '<div class="acsub">收工 ' + min2hm(r.before.end) + ' → ' + min2hm(r.after.end) +
      '（晚 ' + durTxt(dEnd) + '）' +
      (dShut > 0 ? '　<span style="color:var(--vermilion)">會多 ' + dShut + ' 站撲空</span>'
                 : dShut < 0 ? '　少 ' + (-dShut) + ' 站撲空' : '') +
      '</div></span>' +
      '<button class="btn" data-put="' + i + '" style="min-height:26px;padding:0 8px">排</button>' +
      '</div>';
  }).join('');

  openSheet('排進哪一天',
    '<p class="prose" style="margin-bottom:10px">' +
      '把「<b>' + esc(card.data.name) + '</b>」插進每一天最省的位置各試一次，由划算排到不划算。' +
      '第一站與最後一站不動，所以只試中間的位置。</p>' +
    '<div>' + body + '</div>' +
    '<p class="hint">「晚」是那一天的收工時間會往後多少。' +
      '撲空是指插進去之後有幾站會在沒營業的時候到。</p>',
    () => {
      $$('[data-put]').forEach(b => b.onclick = async () => {
        const r = rows[parseInt(b.dataset.put, 10)];
        await moveCard(card, r.d, r.beforeId);
        closeSheet();
        S.day = r.d; S.open = card.id; render();
        if (S.trip.autoRoute) ensureLegs(r.d, true);
        toast('已排進第 ' + (r.d + 1) + ' 天');
      });
    });
}

async function sheetPlan() {
  const d = S.day;
  const list0 = dayCards(d);
  if (list0.length < 4) return toast('這一天不到四站，沒有重排的餘地');
  toast('正在向 Google 要實際車程…', 4000);
  const mx = await dayMatrix(d, list0);
  const r = planDay(d, mx);
  if (!r) return toast('這一天不到四站，沒有重排的餘地');
  const noCoord = r.anchor.filter((a, i) => a && !r.pt[i]).length;
  const rows = r.after.map((idx, k) => {
    const c = r.list[idx];
    const moved = idx !== r.before[k];
    return '<div class="todo"><span class="t" style="' + (moved ? 'font-weight:600' : 'opacity:.65') +
      '">' + (k + 1) + '. ' + esc(c.data.name || '未命名') +
      (r.anchor[idx] ? '　<span class="lab" style="letter-spacing:.06em">固定</span>' : '') +
      '</span></div>';
  }).join('');
  const saved = r.lenBefore - r.lenAfter;
  const A = r.scoreBefore, B = r.scoreAfter;
  const known = r.list.filter(c => c.data.place && c.data.place.hoursPeriods).length;
  const shutRows = (() => {
    const dp = dateParts(dayDate(d));
    let t = hm2min(dayStart(d)); if (t == null) t = 540;
    const cost = makeCost(r.list, r.pt, mx);
    const out = [];
    for (let k = 0; k < r.after.length; k++) {
      const c = r.list[r.after[k]];
      const pin = hm2min(c.data.pinTime);
      const arrive = (pin != null && pin >= t) ? pin : t;
      const per = c.data.place && c.data.place.hoursPeriods;
      if (per) { const o = isOpenAt(per, dp.w, arrive);
        if (!o.unknown && !o.open) out.push(min2hm(arrive) + '　' + (c.data.name || '未命名')); }
      const depart = arrive + (Number(c.data.stayMin) || 0);
      if (k < r.after.length - 1) t = depart + cost(r.after[k], r.after[k + 1]);
    }
    return out;
  })();

  openSheet('排順路',
    '<p class="prose" style="margin-bottom:10px">' +
      (r.changed
        ? '重排之後，收工時間從 <b>' + min2hm(A.end) + '</b> 變成 <b>' + min2hm(B.end) +
          '</b>，開車距離從 <b>' + dist(Math.round(r.lenBefore)) + '</b> 降到 <b>' +
          dist(Math.round(r.lenAfter)) + '</b>。'
        : '算過了，目前的順序已經是最好的，沒有東西要改。') +
    '</p>' +
    '<div class="fld stack"><span class="lab">重排後的順序</span><div>' + rows + '</div></div>' +
    '<div class="fld stack"><span class="lab">比較</span><div class="hours">' +
      '<div>收工　' + min2hm(A.end) + ' → ' + min2hm(B.end) +
        (B.end < A.end ? '　早收 ' + durTxt(A.end - B.end)
         : B.end > A.end ? '　晚收 ' + durTxt(B.end - A.end) : '　沒變') + '</div>' +
      '<div>路上　' + durTxt(Math.round(A.travel)) + ' → ' + durTxt(Math.round(B.travel)) + '</div>' +
      '<div>枯等　' + durTxt(Math.round(A.wait)) + ' → ' + durTxt(Math.round(B.wait)) + '</div>' +
      '<div' + (B.shut ? ' style="color:var(--vermilion)"' : '') + '>撲空　' +
        A.shut + ' 站 → ' + B.shut + ' 站' +
        (known ? '（' + known + ' 站有營業時間可比對）' : '（沒有任何一站有營業時間資料）') +
        '</div>' +
      '</div></div>' +
    (shutRows.length
      ? '<div class="fld stack"><span class="lab">重排後仍然撲空</span><div class="hours">' +
        shutRows.map(x => '<div style="color:var(--vermilion)">' + esc(x) + '</div>').join('') +
        '</div></div>'
      : '') +
    '<p class="hint" style="margin-bottom:12px">' +
      '路程用的是 <b>' + (r.mx ? 'Google 的實際車程' : '直線距離估算') + '</b>' +
      (r.mx ? '（含出發時段的路況）。' : '——沒拿到實際車程，山路會被低估。') + '<br>' +
      '營業時間是<b>約束</b>不是事後檢查：會撲空的順序在被選中之前就已經淘汰了。<br>' +
      '「固定」的不會動：當天第一站與最後一站、所有釘選時間的卡' +
      (noCoord ? '、以及 ' + noCoord + ' 張沒有座標的卡' : '') + '。<br>' +
      '順序變動的路段，原本的路程時間會被清掉並重新查詢。' +
    '</p>' +
    (r.changed ? '<button class="btn fill wide" id="planGo">套用這個順序</button>' : '') +
    '<button class="btn wide" id="planGoogle" style="margin-top:8px">改用 Google 排程器</button>' +
    '<div id="planOut"></div>',
    () => {
      $('#planGoogle').onclick = () => runGoogleOptimizer(d);
      const go = $('#planGo');
      if (go) go.onclick = async () => {
        /* 只有仍然相鄰的那一對才留得住既有的路程時間，其餘清掉——
           留著錯的數字比沒有數字更糟。 */
        const keep = new Set();
        for (let k = 0; k < r.after.length - 1; k++) {
          const a = r.after[k], b = r.after[k + 1];
          if (b === a + 1) keep.add(a);
        }
        let key = '';
        for (let k = 0; k < r.after.length; k++) {
          const c = r.list[r.after[k]];
          key = keyBetween(key, '');
          c.orderKey = key;
          if (!keep.has(r.after[k])) c.data.leg = c.data.leg ? { mode: c.data.leg.mode } : null;
          await touch(c);
        }
        closeSheet();
        if (S.trip.autoRoute) ensureLegs(d, true);
        render();
        toast('已重排，收工 ' + min2hm(B.end));
      };
    });
}

async function runGoogleOptimizer(d) {
  const out = $('#planOut'), btn = $('#planGoogle');
  btn.disabled = true; out.innerHTML = '<div class="acbusy">Google 排程器計算中…</div>';
  try {
    const g = await optimizeDay(d);
    const rows = g.order.map((idx, k) =>
      '<div class="todo"><span class="t">' + (k + 1) + '. ' +
      esc(g.list[idx].data.name || '未命名') + '</span></div>').join('');
    out.innerHTML =
      '<div class="fld stack" style="margin-top:12px"><span class="lab">Google 排程器的順序</span>' +
      '<div>' + rows + '</div></div>' +
      (g.closed.length ? '<p class="hint" style="color:var(--vermilion)">這一天公休、排到哪裡都沒用：' +
        g.closed.map(esc).join('、') + '</p>' : '') +
      (g.skipped.length ? '<p class="hint">沒有座標、沒進模型（維持原位）：' +
        g.skipped.map(esc).join('、') + '</p>' : '') +
      '<button class="btn fill wide" id="planGoGo" style="margin-top:8px">套用 Google 的順序</button>';
    $('#planGoGo').onclick = async () => {
      let key = '';
      for (let k = 0; k < g.order.length; k++) {
        const c = g.list[g.order[k]];
        key = keyBetween(key, '');
        c.orderKey = key;
        c.data.leg = c.data.leg ? { mode: c.data.leg.mode } : null;
        await touch(c);
      }
      closeSheet();
      if (S.trip.autoRoute) ensureLegs(d, true);
      render();
      toast('已套用 Google 排程器的順序');
    };
  } catch (e) {
    const msg = {
      NO_SA_KEY: '這一支不吃 API key，要另外設一組服務帳戶金鑰（見 docs/GOOGLE-MAPS-SETUP.md）。' +
                 '在那之前，上面本地解算器的結果一樣可以用。',
      TOO_FEW: '這一天不到四站。',
      NO_ENDS: '第一站或最後一站沒有座標，解算器需要起訖點。',
      NO_MOVABLE: '可以動的站不到兩個。',
      PAST_DATE: '這一天已經過了，Route Optimization 不收過去的時間。',
      NO_SOLUTION: '在營業時間與釘選的限制下找不到可行解——通常是某一站的時間窗互相打架。',
      UNASSIGNED: '有站排不進去（時間窗打架），整個順序就不給套用了：' +
                  (e.lost || []).join('、'),
    }[e.code] || ('失敗：' + (e.code || e.message));
    out.innerHTML = '<p class="hint" style="margin-top:10px;color:var(--vermilion)">' + esc(msg) + '</p>';
  } finally {
    btn.disabled = false;
  }
}

/* 一天的形狀：橫軸是時間，每一站畫成一段膠囊，站與站之間的空白就是
   移動與空檔。原本那排等寬長條只編碼了「停留多久」，看不出停在什麼時候、
   也看不出兩小時的空檔卡在哪裡——那是不誠實的編碼。
   取自 lieflat-charts 的 G1 Range Capsules（每個項目一個 min–max 區間），
   因為頁首只有幾十像素高，改成共用一條時間軸而不是一站一格。 */
function dayStrip(sched, d) {
  if (sched.length < 2) return '';
  const start = hm2min(dayStart(d));
  const end = sched[sched.length - 1].depart;
  const span = end - start;
  if (!isFinite(span) || span <= 0) return '';
  const pct = m => clamp((m - start) / span * 100, 0, 100);
  const caps = sched.map(r => {
    const x = pct(r.arrive), w = Math.max(1.4, pct(r.depart) - x);
    return '<i style="left:' + x.toFixed(2) + '%;width:' + w.toFixed(2) + '%"></i>';
  }).join('');
  const pins = sched.filter(r => r.pin != null)
    .map(r => '<b style="left:' + pct(r.arrive).toFixed(2) + '%"></b>').join('');
  /* 今天才畫「現在」。它是這條時間軸上唯一會自己動的東西，
     所以用一條穿透全高的線，不跟膠囊搶。 */
  const n = nowMin();
  const now = (d === todayIndex() && n >= start && n <= end)
    ? '<u style="left:' + pct(n).toFixed(2) + '%"></u>' : '';
  return '<div class="strip">' + caps + pins + now + '</div>' +
    '<div class="striplab"><span>' + min2hm(start) + '</span>' +
    '<span>全程 ' + durTxt(span) + '</span>' +
    '<span>' + min2hm(end) + '</span></div>';
}

function renderSync() {
  const b = $('#syncBtn');
  if (!S.trip) return;
  const dirty = S.cards.filter(c => c.dirty).length + (S.trip.dirtyMeta ? 1 : 0);
  const conflicts = S.cards.filter(c => c.conflict).length;
  let t = '', cls = 'sync';
  if (!navigator.onLine) t = '離線\n' + (dirty ? dirty + ' 筆待傳' : '已存本機');
  else if (S.syncErr) { t = '同步失敗\n點一下重試'; cls += ' err'; }
  else if (S.syncing) t = '同步中…';
  else if (conflicts) { t = conflicts + ' 張撞車'; cls += ' err'; }
  else if (dirty) t = dirty + ' 筆待傳';
  else t = '已同步\n' + (S.trip.nick || '');
  b.className = cls;
  b.innerHTML = esc(t).replace(/\n/g, '<br>');
}
</script>

<style>
.insertline{position:absolute;left:0;right:12px;height:4px;border-radius:2px;background:var(--vermilion);
  z-index:25;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.lmar{cursor:default}
.edit .lmar{touch-action:none;cursor:grab}
/* 抓握處：三條細規線，比打孔輕，不搶類別方磚 */
.lmar .grip{display:block;width:15px;height:6px;margin-top:5px;
  background:repeating-linear-gradient(to bottom,currentColor 0 1px,transparent 1px 3px);opacity:.6}
</style>
<script>
'use strict';
/* ═══ 抽頁 ═══════════════════════════════════════════════════ */
function openSheet(title, html, after) {
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = html;
  $('#sheetWrap').classList.add('open');
  if (after) after();
}
function closeSheet() { $('#sheetWrap').classList.remove('open'); }

/* ═══ 板面上的互動 ═══════════════════════════════════════════ */
function cardById(id) { return S.cards.find(c => c.id === id); }

function bindPlate() {
  const p = $('#plate');
  const home = $('#btnHome'); if (home) home.onclick = leaveTrip;
  const st = $('#btnStart'); if (st) st.onclick = sheetDayStart;
  const pl = $('#btnPlan'); if (pl) pl.onclick = sheetPlan;
  const nr = $('#btnNear'); if (nr) nr.onclick = sheetNearby;
  $$('[data-open]', p).forEach(n => n.onclick = () => {
    S.open = (S.open === n.dataset.open) ? null : n.dataset.open;
    renderPlate();
    if (S.open) { const a = $('[data-card="' + S.open + '"]', p); if (a) a.scrollIntoView({ block:'nearest' }); }
  });
  $$('[data-grip]', p).forEach(n => n.addEventListener('pointerdown', e => gripDown(e, n.dataset.grip)));
  $$('[data-edit]', p).forEach(n => n.onclick = () => sheetEdit(cardById(n.dataset.edit)));
  $$('[data-leg]',  p).forEach(n => n.onclick = () => sheetLeg(cardById(n.dataset.leg)));
  $$('[data-dup]',  p).forEach(n => n.onclick = () => dupToNextDay(cardById(n.dataset.dup)));
  $$('[data-hours]', p).forEach(n => n.onclick = e => {
    e.stopPropagation();
    const box = n.closest('.hours').querySelector('.hidden-hours');
    box.classList.toggle('hide');
    n.textContent = box.classList.contains('hide') ? '全部' : '收起';
  });
  $$('[data-todo]', p).forEach(n => n.onclick = async () => {
    const [cid, tid] = n.dataset.todo.split('|');
    const c = cardById(cid); const t = c.data.todos.find(x => x.id === tid);
    if (!t) return;
    t.done = !t.done; await touch(c); renderPlate();
  });
  $$('[data-copy]', p).forEach(n => n.onclick = () => {
    navigator.clipboard.writeText(n.dataset.copy)
      .then(() => toast('已複製'), () => toast('複製失敗'));
  });
  $$('[data-here]', p).forEach(n => n.onclick = async () => {
    const id = n.dataset.here;
    S.rebase = { day: S.day, id, min: nowMin(), on: todayISO() };
    await kvSet('rebase', S.rebase);
    render();
    toast('已用現在的時間重推這一天');
  });
  $$('[data-unrebase]', p).forEach(n => n.onclick = async () => {
    S.rebase = null; await kvSet('rebase', null); render(); toast('已回到原本的計畫時刻');
  });
  $$('[data-bestday]', p).forEach(n => n.onclick = () => sheetBestDay(n.dataset.bestday));
  $$('[data-keep]', p).forEach(n => n.onclick = async () => {
    const c = cardById(n.dataset.keep);
    c.rev = c.conflict.rev; c.conflict = null; c.dirty = true;
    await dbPut('cards', c); syncNow(true); render();
  });
  $$('[data-take]', p).forEach(n => n.onclick = async () => {
    const c = cardById(n.dataset.take);
    c.data = c.conflict.data; c.dayIndex = c.conflict.dayIndex; c.orderKey = c.conflict.orderKey;
    c.rev = c.conflict.rev; c.conflict = null; c.dirty = false;
    await dbPut('cards', c); render();
  });
}

/* ── 拖曳：抓左邊的時刻欄，放開才落位；拖的時候畫一條插入標線 ── */
let DRAG = null;
function gripDown(e, id) {
  if (!S.edit) return;                    // 只有編輯模式才拖得動
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const leaf = e.currentTarget.closest('.leaf');
  DRAG = { id, leaf, startY: e.clientY, moved:false, line:null, targetIdx:0 };
  window.addEventListener('pointermove', dragMove, { passive:false });
  window.addEventListener('pointerup', dragEnd);
  window.addEventListener('pointercancel', dragEnd);
}
function dragMove(e) {
  if (!DRAG) return;
  const dy = e.clientY - DRAG.startY;
  if (!DRAG.moved) {
    if (Math.abs(dy) < 6) return;
    DRAG.moved = true;
    DRAG.leaf.classList.add('drag');
    DRAG.line = el('div', 'insertline');
    $('#plate').appendChild(DRAG.line);
  }
  e.preventDefault();
  DRAG.leaf.style.transform = 'translateY(' + dy + 'px)';

  const plate = $('#plate'), pr = plate.getBoundingClientRect();
  const leaves = $$('.leaf[data-card]', plate);
  let idx = leaves.length;
  for (let i = 0; i < leaves.length; i++) {
    const r = leaves[i].getBoundingClientRect();
    if (e.clientY < r.top + r.height / 2) { idx = i; break; }
  }
  DRAG.targetIdx = idx;
  const ref = leaves[idx];
  const y = ref ? ref.getBoundingClientRect().top
                : (leaves.length ? leaves[leaves.length - 1].getBoundingClientRect().bottom : pr.top);
  DRAG.line.style.top = (y - pr.top + plate.scrollTop - 2) + 'px';

  if (e.clientY < pr.top + 70) plate.scrollTop -= 9;
  else if (e.clientY > pr.bottom - 90) plate.scrollTop += 9;
}
async function dragEnd() {
  window.removeEventListener('pointermove', dragMove);
  window.removeEventListener('pointerup', dragEnd);
  window.removeEventListener('pointercancel', dragEnd);
  if (!DRAG) return;
  const d = DRAG; DRAG = null;
  if (d.line) d.line.remove();
  d.leaf.style.transform = ''; d.leaf.classList.remove('drag');
  if (!d.moved) return;
  const ids = $$('.leaf[data-card]', $('#plate')).map(n => n.dataset.card);
  let before = d.targetIdx < ids.length ? ids[d.targetIdx] : null;
  if (before === d.id) before = (d.targetIdx + 1 < ids.length) ? ids[d.targetIdx + 1] : null;
  const c = cardById(d.id);
  if (!c) return;
  await moveCard(c, S.day, before);
  if (S.day >= 0) ensureLegs(S.day);
  render();
}

/* ═══ 新增卡片 ═══════════════════════════════════════════════ */
function sheetAdd() {
  const dayOpts = ['<option value="-1">候選口袋</option>'];
  for (let i = 0; i < S.trip.days; i++) {
    const dp = dateParts(dayDate(i));
    dayOpts.push('<option value="' + i + '"' + (i === S.day ? ' selected' : '') + '>第 ' + (i + 1) +
                 ' 天 · ' + dp.m + '/' + dp.d + '</option>');
  }
  openSheet('新增行程',
    '<div class="fld stack"><span class="lab">Google 地圖網址，或直接打名稱</span>' +
    '<textarea class="inp" id="addSrc" style="min-height:76px;font-family:var(--mono);font-size:14px" ' +
    'placeholder="https://maps.app.goo.gl/… 或 清水寺"></textarea>' +
    '<div id="acList" class="aclist hide"></div></div>' +
    '<div class="fld stack"><span class="lab">放到哪一天</span>' +
    '<select class="inp" id="addDay">' + dayOpts.join('') + '</select></div>' +
    '<button class="btn fill wide" id="addGo">抓取並新增</button>' +
    '<button class="btn wide" id="addManual" style="margin-top:8px">不抓資料，手動建一張</button>' +
    '<p class="hint">從 iPhone 的 Google 地圖 App 分享出來的短網址可以直接貼。' +
    '抓回來的是名稱、地址、電話、座標、營業時間與評分。</p>',
    () => {
      /* ── 打字就跳候選 ──────────────────────────────────
         同一個 sessionToken 貫穿「一路打字＋最後選一個」，Google 會把
         整段算成一次工作階段計費，而不是每敲一個字算一次。 */
      const token = uuid();
      const box = $('#acList'), src = $('#addSrc');
      let timer = null, seq = 0;
      const hideAc = () => { box.classList.add('hide'); box.innerHTML = ''; };
      const pick = async (pid, name) => {
        hideAc();
        $('#addGo').disabled = true; $('#addGo').textContent = '抓取中…';
        try {
          const day = parseInt($('#addDay').value, 10);
          const res = await gmap('resolve', { url:
            pidUrl(pid) });
          const pl = res.place || {};
          const c = await addCard(day, {
            name: pl.name || name, stayMin: 60, catId: guessCat(pl), place: pl,
          });
          closeSheet();
          S.day = day; S.open = c.id; render();
          if (day >= 0) { ensureLegs(day); loadWeather(day); }
          toast('已加入：' + (pl.name || name));
        } catch (e) {
          $('#addGo').disabled = false; $('#addGo').textContent = '抓取並新增';
          toast(gmapMsg(e));
        }
      };
      src.addEventListener('input', () => {
        const v = src.value.trim();
        clearTimeout(timer);
        // 貼網址的人不需要候選；兩個字以下也還不夠 Google 判斷。
        if (v.length < 2 || /^https?:\/\//i.test(v) || /goo\.gl|google\.[a-z.]+\/maps/i.test(v)) {
          hideAc(); return;
        }
        timer = setTimeout(async () => {
          const mine = ++seq;
          box.classList.remove('hide');
          box.innerHTML = '<div class="acbusy">搜尋中…</div>';
          try {
            const r = await gmap('autocomplete',
              { input: v, bias: tripCenter() || undefined, sessionToken: token });
            if (mine !== seq) return;                    // 打得比回應快，舊的丟掉
            if (!r.suggestions.length) { box.innerHTML = '<div class="acbusy">找不到</div>'; return; }
            box.innerHTML = r.suggestions.slice(0, 6).map(x =>
              '<button class="acitem" data-pid="' + esc(x.placeId || '') + '" data-nm="' + esc(x.main) + '">' +
              '<div class="acmain">' + esc(x.main) + '</div>' +
              (x.sub ? '<div class="acsub">' + esc(x.sub) + '</div>' : '') + '</button>').join('');
            $$('#acList .acitem').forEach(b => {
              b.onclick = () => { if (b.dataset.pid) pick(b.dataset.pid, b.dataset.nm); };
            });
          } catch (e) {
            if (mine !== seq) return;
            hideAc();
          }
        }, 280);
      });

      $('#addGo').onclick = async () => {
        const src = $('#addSrc').value.trim();
        const day = parseInt($('#addDay').value, 10);
        if (!src) return toast('先貼上網址或打名稱');
        $('#addGo').disabled = true; $('#addGo').textContent = '抓取中…';
        try {
          const isUrl = /^https?:\/\//i.test(src) || /goo\.gl|google\.[a-z.]+\/maps/i.test(src);
          const res = await gmap('resolve', isUrl ? { url:src } : { query:src });
          const pl = res.place || {};
          const c = await addCard(day, {
            name: pl.name || src.slice(0, 40), stayMin: 60,
            catId: guessCat(pl), place: pl,
          });
          closeSheet();
          S.day = day; S.open = c.id; render();
          if (day >= 0) { ensureLegs(day); loadWeather(day); }
          toast(res.partial ? '只抓到座標，名稱請自己補' : '已加入：' + (pl.name || ''));
        } catch (e) {
          $('#addGo').disabled = false; $('#addGo').textContent = '抓取並新增';
          toast(gmapMsg(e));
        }
      };
      $('#addManual').onclick = async () => {
        const day = parseInt($('#addDay').value, 10);
        const c = await addCard(day, { name: $('#addSrc').value.trim() });
        closeSheet(); S.day = day; S.open = c.id; render(); sheetEdit(c);
      };
    });
}
/* 搜尋偏置的中心＝所有已知座標的平均。沒有任何座標時回 null，
   讓 Google 用全球範圍找——總比拿手機定位（在台灣）去偏置日本的地名好。 */
function tripCenter() {
  let n = 0, la = 0, lo = 0;
  (S.cards || []).forEach(c => {
    if (c.deleted) return;
    const p = c.data && c.data.place;
    if (p && p.lat != null) { la += p.lat; lo += p.lng; n++; }
  });
  return n ? { lat: la / n, lng: lo / n, radius: 50000 } : null;
}

/* 口袋的探索模式：以行程裡任何一站為圓心，問 Google 附近有什麼。
   口袋原本只是一份手打清單，這讓它變成「還沒決定要不要去」的取材處。
   一次呼叫吃一次 Nearby Search（含星等是 Enterprise 級，每月 1,000 次免費），
   所以預設只回 12 筆、也不做自動搜尋——一定要按下去才打。 */
const NEAR_KINDS = [
  { id: 'food',  name: '飲食', types: ['restaurant', 'cafe'] },
  { id: 'sight', name: '景點', types: ['tourist_attraction'] },
  { id: 'shop',  name: '購物', types: ['shopping_mall', 'department_store'] },
  { id: 'stay',  name: '住宿', types: ['lodging'] },
  { id: 'conv',  name: '便利商店', types: ['convenience_store'] },
];
function sheetNearby() {
  const spots = (S.cards || []).filter(c => !c.deleted &&
    c.data.place && c.data.place.lat != null);
  if (!spots.length) return toast('還沒有任何一站有座標，沒有圓心可以找');
  /* 預設圓心挑「當天的第一站」，沒有就挑第一張有座標的。 */
  const pref = spots.find(c => c.dayIndex === S.day) || spots[0];
  const opts = spots.map(c => {
    const tag = c.dayIndex < 0 ? '口袋' : '第 ' + (c.dayIndex + 1) + ' 天';
    return '<option value="' + c.id + '"' + (c.id === pref.id ? ' selected' : '') + '>' +
           esc(c.data.name || '未命名') + '（' + tag + '）</option>';
  }).join('');

  openSheet('找附近',
    '<div class="fld stack"><span class="lab">以哪一站為圓心</span>' +
    '<select class="inp" id="nrBase">' + opts + '</select></div>' +
    '<div class="fld stack"><span class="lab">找什麼</span><div class="cats" id="nrKind">' +
    NEAR_KINDS.map((k, i) => '<button class="cat' + (i === 0 ? ' on' : '') +
      '" data-k="' + k.id + '">' + k.name + '</button>').join('') + '</div></div>' +
    '<div class="fld stack"><span class="lab">半徑</span>' +
    '<select class="inp" id="nrRad">' +
    [[500,'500 公尺'],[1500,'1.5 公里'],[3000,'3 公里'],[10000,'10 公里']]
      .map(([v,t]) => '<option value="' + v + '"' + (v === 1500 ? ' selected' : '') + '>' + t + '</option>')
      .join('') + '</select></div>' +
    '<button class="btn fill wide" id="nrGo">搜尋</button>' +
    '<div id="nrOut" style="margin-top:12px"></div>' +
    '<p class="hint">找到的地方會加進<b>候選口袋</b>，不會直接插進某一天。' +
    '每按一次搜尋就是一次 Google 查詢，所以不會自動搜。</p>',
    () => {
      let kind = NEAR_KINDS[0];
      $$('#nrKind [data-k]').forEach(n => n.onclick = () => {
        kind = NEAR_KINDS.find(k => k.id === n.dataset.k) || NEAR_KINDS[0];
        $$('#nrKind .cat').forEach(x => x.classList.toggle('on', x.dataset.k === kind.id));
      });
      $('#nrGo').onclick = async () => {
        const base = spots.find(c => c.id === $('#nrBase').value);
        if (!base) return;
        const out = $('#nrOut');
        $('#nrGo').disabled = true; out.innerHTML = '<div class="acbusy">搜尋中…</div>';
        try {
          const p = base.data.place;
          const r = await gmap('nearby', {
            center: { lat: p.lat, lng: p.lng },
            types: kind.types,
            radius: parseInt($('#nrRad').value, 10),
            max: 12,
          });
          /* 已經在行程裡的就不要再列一次——口袋裡塞重複的地點是純噪音。 */
          const have = new Set((S.cards || []).filter(c => !c.deleted)
            .map(c => (c.data.place && c.data.place.placeId) || '').filter(Boolean));
          const rows = r.places.filter(x => !have.has(x.placeId));
          if (!rows.length) { out.innerHTML = '<div class="acbusy">附近沒有新的（或都已經在行程裡了）</div>'; return; }
          out.innerHTML = rows.map((x, i) => {
            const km = dist(Math.round(haversine([p.lat, p.lng], [x.lat, x.lng])));
            return '<div class="todo"><span class="t"><b>' + esc(x.name) + '</b>' +
              '<div class="acsub">' + (x.rating ? '★ ' + x.rating + '（' + (x.ratingCount || 0) + '）· ' : '') +
              (x.type ? esc(x.type) + ' · ' : '') + km + '</div></span>' +
              '<button class="btn" data-add="' + i + '" style="min-height:26px;padding:0 8px">加</button></div>';
          }).join('');
          $$('#nrOut [data-add]').forEach(b => b.onclick = async () => {
            const x = rows[parseInt(b.dataset.add, 10)];
            b.disabled = true; b.textContent = '✓';
            await addCard(-1, {
              name: x.name, stayMin: 60,
              catId: guessCat({ type: x.type, name: x.name }),
              place: { placeId: x.placeId, name: x.name, address: x.address,
                       lat: x.lat, lng: x.lng, rating: x.rating,
                       ratingCount: x.ratingCount, type: x.type },
            });
            render();
          });
        } catch (e) {
          out.innerHTML = '';
          toast(gmapMsg(e));
        } finally {
          $('#nrGo').disabled = false;
        }
      };
    });
}

/* Google 給的 primaryTypeDisplayName 拿來猜類別；猜錯使用者一秒就能改。 */
function guessCat(pl) {
  const t = ((pl.type || '') + ' ' + (pl.name || ''));
  if (/旅館|飯店|旅店|hotel|inn|ryokan|hostel|民宿/i.test(t)) return 'stay';
  if (/餐廳|食堂|拉麵|咖啡|居酒屋|restaurant|cafe|bar|bakery|燒肉|壽司/i.test(t)) return 'food';
  if (/神社|寺|城|遺跡|史蹟|temple|shrine|castle|museum|博物館|美術館/i.test(t)) return 'heritage';
  if (/百貨|商店|市場|藥妝|outlet|store|shopping|市集/i.test(t)) return 'shop';
  if (/公園|山|湖|瀑布|海岸|溫泉|park|mountain|lake|falls|onsen|garden|庭園/i.test(t)) return 'nature';
  if (/樂園|水族館|體驗|動物園|aquarium|zoo|park.*amusement/i.test(t)) return 'play';
  return '';
}

/* ═══ 編輯卡片 ═══════════════════════════════════════════════ */
function sheetEdit(c) {
  if (!c) return;
  const d = c.data;
  const cats = catsOf().map(x =>
    '<button class="cat' + (d.catId === x.id ? ' on' : '') + '" data-cat="' + esc(x.id) + '">' +
