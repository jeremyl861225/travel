    '<div class="fld stack"><span class="lab">名稱</span>' +
    '<input class="inp" id="eName" value="' + esc(d.name) + '"></div>' +
    '<div class="fld stack"><span class="lab">類別</span><div class="cats" id="eCats">' + cats +
    '<button class="cat" data-cat="">無</button></div></div>' +
    '<div class="row" style="gap:10px;margin-bottom:13px">' +
      '<div style="flex:1"><span class="lab">停留（分鐘）</span>' +
      '<input class="inp" id="eStay" type="number" min="0" max="1440" step="5" value="' +
      (Number(d.stayMin) || 0) + '"></div>' +
      '<div style="flex:1"><span class="lab">釘選時間</span>' +
      '<input class="inp" id="ePin" type="time" value="' + esc(d.pinTime || '') + '"></div>' +
    '</div>' +
    /* Google 只給閉館時刻，不給最後入場。日本的館所普遍提早 30 分停止入場，
       這一欄沒填就不判斷——寧可不提醒，也不要拿猜的去嚇人。 */
    '<div class="fld stack"><span class="lab">最後入場（閉館前幾分鐘，沒有就留 0）</span>' +
    '<input class="inp" id="eLast" type="number" min="0" max="180" step="5" value="' +
    (Number(d.lastEntry) || 0) + '"></div>' +
    /* マップコード是 DENSO 的專有規格，沒有公開 API 可以算，只能手填。
       國際標準的那個 Mapcode 是完全不同的東西，日規導航不吃。 */
    '<div class="fld stack"><span class="lab">マップコード（日規導航用，要自己查來貼）</span>' +
    '<input class="inp" id="eMapcode" value="' + esc(d.mapcode || '') +
    '" placeholder="例：123 456 789*12"></div>' +
    '<div class="fld stack"><span class="lab">介紹</span>' +
    '<textarea class="inp" id="eNote">' + esc(d.note || '') + '</textarea></div>' +
    '<div class="fld stack"><span class="lab">網址連結（一行一個，可用「名稱 網址」）</span>' +
    '<textarea class="inp" id="eLinks" style="min-height:70px;font-family:var(--mono);font-size:13px">' +
    esc((d.links || []).map(l => (l.label && l.label !== l.url ? l.label + ' ' : '') + l.url).join('\n')) +
    '</textarea></div>' +
    '<div class="fld stack"><span class="lab">預定事項（一行一個）</span>' +
    '<textarea class="inp" id="eTodos" style="min-height:70px;font-family:var(--mono);font-size:13px">' +
    esc((d.todos || []).map(t => t.text).join('\n')) + '</textarea></div>' +
    '<div class="fld stack"><span class="lab">圖片網址（一行一個）</span>' +
    '<textarea class="inp" id="eImgs" style="min-height:56px;font-family:var(--mono);font-size:13px">' +
    esc((d.images || []).join('\n')) + '</textarea></div>' +
    '<div class="fld stack"><span class="lab">放在哪一天</span>' +
    '<select class="inp" id="eDay">' +
      '<option value="-1"' + (c.dayIndex === -1 ? ' selected' : '') + '>候選口袋</option>' +
      Array.from({ length: S.trip.days }, (_, i) => {
        const dp = dateParts(dayDate(i));
        return '<option value="' + i + '"' + (c.dayIndex === i ? ' selected' : '') +
               '>第 ' + (i + 1) + ' 天 · ' + dp.m + '/' + dp.d + '</option>';
      }).join('') + '</select></div>' +
    '<div class="row" style="margin-bottom:14px">' +
    '<button class="btn" id="eRefetch">重新抓 Google 資料</button>' +
    (d.place ? '<button class="btn" id="eClearPlace">清除地點資料</button>' : '') + '</div>' +
    '<button class="btn fill wide" id="eSave">儲存</button>' +
    '<button class="btn wide" id="eDel" style="margin-top:9px;color:var(--vermilion);' +
    'border-color:var(--vermilion)">刪除這張卡</button>',
    () => {
      let cat = d.catId;
      $$('#eCats [data-cat]').forEach(n => n.onclick = () => {
        cat = n.dataset.cat;
        $$('#eCats .cat').forEach(x => x.classList.toggle('on', x.dataset.cat === cat));
      });
      $('#eRefetch').onclick = async () => {
        const q = $('#eName').value.trim(); if (!q) return toast('先填名稱');
        try {
          const p = d.place || {};
          const res = await gmap('resolve', { query:q, lat:p.lat, lng:p.lng });
          d.place = res.place; await touch(c); toast('已更新地點資料'); closeSheet(); render();
        } catch (e) { toast(gmapMsg(e)); }
      };
      const cp = $('#eClearPlace');
      if (cp) cp.onclick = async () => { d.place = null; d.leg = null; await touch(c); closeSheet(); render(); };
      $('#eDel').onclick = async () => {
        if (!confirm('刪除「' + (d.name || '這張卡') + '」？')) return;
        await delCard(c); closeSheet(); S.open = null; render();
      };
      $('#eSave').onclick = async () => {
        const toDay = parseInt($('#eDay').value, 10);
        if (toDay !== c.dayIndex) await moveCard(c, toDay, null);
        d.name = $('#eName').value.trim();
        d.catId = cat;
        d.stayMin = clamp(parseInt($('#eStay').value, 10) || 0, 0, 1440);
        d.lastEntry = clamp(parseInt($('#eLast').value, 10) || 0, 0, 180);
        d.mapcode = $('#eMapcode').value.trim();
        d.pinTime = $('#ePin').value || '';
        d.note = $('#eNote').value;
        d.links = $('#eLinks').value.split('\n').map(s => s.trim()).filter(Boolean).map(s => {
          const m = /^(.*?)\s+(https?:\/\/\S+)$/.exec(s);
          return m ? { label:m[1], url:m[2] } : { label:s, url:s };
        });
        const old = d.todos || [];
        d.todos = $('#eTodos').value.split('\n').map(s => s.trim()).filter(Boolean).map(text => {
          const prev = old.find(t => t.text === text);
          return { id: prev ? prev.id : uuid(), text, done: prev ? prev.done : false };
        });
        d.images = $('#eImgs').value.split('\n').map(s => s.trim()).filter(Boolean);
        await touch(c); closeSheet();
        S.day = c.dayIndex;
        if (S.day >= 0) ensureLegs(S.day);
        render();
      };
    });
}

function sheetLeg(c) {
  const leg = c.data.leg || {};
  const cur = leg.mode || S.trip.defaultMode || 'drive';
  openSheet('這一段路程',
    '<div class="fld stack"><span class="lab">交通方式</span><div class="cats" id="lgModes">' +
    MODES.map(m => '<button class="cat' + (m.id === cur ? ' on' : '') + '" data-m="' + m.id + '">' +
      mark(m.mark, 'sm') + m.name + '</button>').join('') + '</div></div>' +
    '<div class="fld stack"><span class="lab">路程（分鐘）</span>' +
    '<input class="inp" id="lgMin" type="number" min="0" max="1440" value="' +
    (leg.min == null ? '' : leg.min) + '" placeholder="留白＝讓 Google 算"></div>' +
    '<button class="btn fill wide" id="lgCalc">用 Google 重新計算</button>' +
    '<button class="btn wide" id="lgSave" style="margin-top:8px">用我填的數字</button>',
    () => {
      let m = cur;
      $$('#lgModes [data-m]').forEach(n => n.onclick = () => {
        m = n.dataset.m;
        $$('#lgModes .cat').forEach(x => x.classList.toggle('on', x.dataset.m === m));
      });
      $('#lgCalc').onclick = async () => {
        c.data.leg = { mode:m }; await touch(c); closeSheet();
        await ensureLegs(S.day, true); render();
      };
      $('#lgSave').onclick = async () => {
        const v = parseInt($('#lgMin').value, 10);
        c.data.leg = { mode:m, min: isFinite(v) ? v : null, meters: leg.meters, sig:'manual' };
        await touch(c); closeSheet(); render();
      };
    });
}

function sheetDayStart() {
  openSheet('第 ' + (S.day + 1) + ' 天的出發時間',
    '<p class="prose" style="margin-bottom:12px">這一天從幾點開始動。後面每一站的到達時刻，' +
    '都是從這裡加上「停留＋路程」推出來的。</p>' +
    '<div class="fld stack"><span class="lab">出發</span>' +
    '<input class="inp" id="dsT" type="time" value="' + dayStart(S.day) + '"></div>' +
    '<button class="btn fill wide" id="dsGo">套用這一天</button>' +
    '<button class="btn wide" id="dsAll" style="margin-top:8px">套用到所有天</button>',
    () => {
      $('#dsGo').onclick = async () => {
        S.trip.dayStarts = S.trip.dayStarts || {};
        S.trip.dayStarts[S.day] = $('#dsT').value || '08:30';
        await touchMeta(); closeSheet(); render();
      };
      $('#dsAll').onclick = async () => {
        S.trip.defaultStart = $('#dsT').value || '08:30';
        S.trip.dayStarts = {};
        await touchMeta(); closeSheet(); render();
      };
    });
}

async function dupToNextDay(c) {
  const to = c.dayIndex + 1;
  if (to >= S.trip.days) return toast('已經是最後一天了');
  const list = dayCards(to);
  const copy = await addCard(to, JSON.parse(JSON.stringify(
    Object.assign({}, c.data, { leg:null, todos:(c.data.todos||[]).map(t => ({ ...t, done:false })) }))));
  /* 住宿是隔天的起點，所以插到最前面，不是接在後面。 */
  copy.orderKey = keyBetween('', list.length ? list[0].orderKey : '');
  await touch(copy);
  toast('已複製到第 ' + (to + 1) + ' 天的開頭');
  S.day = to; S.open = copy.id; render(); ensureLegs(to);
}
</script>

<script>
'use strict';
/* ═══ 匯出與匯入 ═══════════════════════════════════════════════
   格式故意做得可讀可手改：整份是明文 JSON，跟雲端上的密文是兩回事。
   匯出的檔案裡有完整行程內容，**不要隨手丟到雲端硬碟或聊天室**。 */
function exportTripJSON() {
  return {
    format: 'travel-trip@1',
    exportedAt: new Date().toISOString(),
    trip: tripMeta(),
    cards: S.cards.filter(c => !c.deleted)
      .sort((a, b) => (a.dayIndex - b.dayIndex) || (a.orderKey < b.orderKey ? -1 : 1))
      .map(c => ({ dayIndex: c.dayIndex, orderKey: c.orderKey, data: c.data })),
  };
}
async function importTripJSON(obj) {
  if (!obj || obj.format !== 'travel-trip@1' || !Array.isArray(obj.cards))
    throw new Error('這不是 Travel 的匯入檔（缺少 format: travel-trip@1）');
  /* 舊卡標記成刪除而不是真刪：不留墓碑的話，其他人的裝置同步回來會把它們復活。 */
  for (const c of S.cards.filter(x => !x.deleted)) {
    c.deleted = true; c.dirty = true; await dbPut('cards', c);
  }
  if (obj.trip) {
    const t = obj.trip;
    if (t.name) S.trip.name = t.name;
    if (t.startDate) S.trip.startDate = t.startDate;
    if (t.days) S.trip.days = clamp(t.days, 1, 60);
    if (t.defaultStart) S.trip.defaultStart = t.defaultStart;
    if (t.dayStarts) S.trip.dayStarts = t.dayStarts;
    if (t.defaultMode) S.trip.defaultMode = t.defaultMode;
    if (t.autoRoute != null) S.trip.autoRoute = t.autoRoute;
    if (Array.isArray(t.cats) && t.cats.length) S.trip.cats = t.cats;
    await touchMeta();
  }
  const blank = { name:'', catId:'', stayMin:60, pinTime:'', note:'',
                  links:[], todos:[], images:[], place:null, leg:null };
  let n = 0, lastKey = '';
  for (const rec of obj.cards) {
    lastKey = rec.orderKey || keyAfter(lastKey);
    const c = {
      id: uuid(), trip: S.trip.code,
      dayIndex: rec.dayIndex == null ? -1 : rec.dayIndex,
      orderKey: lastKey,
      data: Object.assign({}, blank, rec.data || {}),
      rev: 0, deleted: false, dirty: true, conflict: null,
      updatedBy: S.trip.nick || '', updatedAt: new Date().toISOString(),
    };
    S.cards.push(c); await dbPut('cards', c); n++;
  }
  S.day = 0; S.open = null;
  scheduleSync();
  return n;
}
function sheetPorting() {
  openSheet('匯出與匯入',
    '<p class="prose" style="margin-bottom:12px">匯出的是<b>明文</b> JSON，' +
    '整份行程都在裡面。它是備份，也是把別處的行程搬進來的入口。</p>' +
    '<div class="row" style="margin-bottom:16px">' +
    '<button class="btn fill" id="pxCopy">複製到剪貼簿</button>' +
    '<button class="btn" id="pxFile">下載檔案</button></div>' +
    '<div class="fld stack"><span class="lab">貼上匯入檔</span>' +
    '<textarea class="inp" id="pxIn" style="min-height:110px;font-family:var(--mono);' +
    'font-size:12px" placeholder=\'{"format":"travel-trip@1", …}\'></textarea></div>' +
    '<div class="row" style="margin-bottom:12px">' +
    '<input type="file" id="pxPick" accept=".json,application/json" style="font-size:13px"></div>' +
    '<button class="btn wide" id="pxGo" style="color:var(--vermilion);border-color:var(--vermilion)">' +
    '匯入並取代目前的行程</button>' +
    '<p class="hint">匯入會把這趟旅程現有的卡片全部刪掉再換上新的，' +
    '而且會同步給其他人。要保留舊的就先按上面的匯出。</p>',
    () => {
      const json = () => JSON.stringify(exportTripJSON(), null, 1);
      $('#pxCopy').onclick = () => navigator.clipboard.writeText(json())
        .then(() => toast('已複製，可以貼到別的地方'), () => toast('複製失敗，改用下載'));
      $('#pxFile').onclick = () => {
        const b = new Blob([json()], { type:'application/json' });
        const a = el('a'); a.href = URL.createObjectURL(b);
        a.download = (S.trip.name || 'travel') + '.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      };
      $('#pxPick').onchange = e => {
        const f = e.target.files && e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => { $('#pxIn').value = r.result; toast('檔案已讀入，按下面的匯入'); };
        r.readAsText(f);
      };
      $('#pxGo').onclick = async () => {
        let obj;
        try { obj = JSON.parse($('#pxIn').value); }
        catch (e) { return toast('JSON 解析失敗：' + String(e.message).slice(0, 60)); }
        if (!confirm('這會刪掉「' + S.trip.name + '」現有的所有卡片，確定？')) return;
        try {
          const n = await importTripJSON(obj);
          closeSheet(); render();
          toast('匯入了 ' + n + ' 張卡');
        } catch (e) { toast(String(e.message || e).slice(0, 80)); }
      };
    });
}

/* ═══ 旅程設定 ═══════════════════════════════════════════════ */
function sheetTrip() {
  const t = S.trip;
  const cats = catsOf();
  openSheet('旅程設定',
    '<div class="fld stack"><span class="lab">名稱</span>' +
    '<input class="inp" id="tName" value="' + esc(t.name) + '"></div>' +
    /* date input 在 iOS 上會撐出自己的寬度，用 flex 會擠爆隔壁；
       改成 grid 並讓兩欄都 min-width:0，才不會疊在一起。 */
    '<div style="display:grid;grid-template-columns:minmax(0,1fr) 68px;gap:9px;margin-bottom:13px">' +
      '<div style="min-width:0"><span class="lab">出發日</span>' +
      '<input class="inp" id="tStart" type="date" value="' + esc(t.startDate) + '"></div>' +
      '<div style="min-width:0"><span class="lab">天數</span>' +
      '<input class="inp" id="tDays" type="number" min="1" max="60" value="' + (t.days || 1) + '"></div>' +
    '</div>' +
    '<div class="fld stack"><span class="lab">預設交通方式</span><div class="cats" id="tModes">' +
    MODES.map(m => '<button class="cat' + (m.id === (t.defaultMode||'drive') ? ' on' : '') +
      '" data-m="' + m.id + '">' + mark(m.mark,'sm') + m.name + '</button>').join('') + '</div></div>' +
    '<label class="row" style="margin-bottom:14px"><input type="checkbox" id="tAuto"' +
    (t.autoRoute !== false ? ' checked' : '') + '> <span style="font-size:15px">自動用 Google 算路程</span></label>' +
    '<div class="fld stack"><span class="lab">你的暱稱</span>' +
    '<input class="inp" id="tNick" value="' + esc(t.nick || '') + '" maxlength="12"></div>' +

    '<div class="fld stack"><span class="lab">類別</span><div id="tCats">' +
    cats.map(c => '<div class="todo" data-cat="' + esc(c.id) + '">' + mark(c.mark) +
      '<span class="t">' + esc(c.name) + '</span>' +
      (DEFAULT_CATS.some(x => x.id === c.id) ? '<span class="lab">預設</span>' :
       '<button class="btn" data-delcat="' + esc(c.id) + '" style="min-height:26px;padding:0 8px">刪</button>') +
      '</div>').join('') + '</div>' +
    '<div class="row" style="margin-top:9px">' +
    '<input class="inp" id="tNewCat" placeholder="新類別名稱" style="flex:1 1 120px">' +
    '<select class="inp" id="tNewMark" style="flex:0 0 108px">' +
    MARKS.map(m => '<option value="' + m + '">' + m + '</option>').join('') + '</select>' +
    '<button class="btn" id="tAddCat">加</button></div></div>' +

    '<div class="panel" style="margin:16px 0 0;box-shadow:none;background:transparent;' +
    'border-color:var(--rule)"><h3>分享給旅伴</h3>' +
    '<p class="prose" style="font-size:16px">把下面這組代碼與你設的密碼給他們，' +
    '在自己手機上打開同一個網址、輸入就能一起編輯。</p>' +
    '<div class="row" style="margin-top:10px">' +
    '<code style="font-family:var(--mono);font-size:22px;letter-spacing:.16em;font-weight:600">' +
    esc(t.code) + '</code>' +
    '<button class="btn" id="tCopy">複製代碼</button></div>' +
    '<p class="hint">密碼不會顯示在這裡——它是解密金鑰，我們沒有存明文。</p></div>' +

    '<button class="btn wide" id="tPort" style="margin-top:14px">匯出 / 匯入 JSON</button>' +
    '<button class="btn fill wide" id="tSave" style="margin-top:8px">儲存</button>' +
    '<button class="btn wide" id="tForget" style="margin-top:8px;color:var(--vermilion);' +
    'border-color:var(--vermilion)">從這台裝置移除</button>' +
    '<p class="hint">移除只影響這支手機，雲端與其他人的資料不動；' +
    '之後用代碼與密碼還能再加入。</p>' +
    /* 版本與視窗實測值。前者用來確認手機拿到的是不是新版，
       後者是頁底對不齊時唯一能問出真相的數字。 */
    '<p class="hint" style="margin-top:16px;text-align:center;opacity:.7">' +
    BUILD + ' · ' + (STANDALONE ? '獨立' : '瀏覽器') + '</p>',

    () => {
      let m = t.defaultMode || 'drive';
      $$('#tModes [data-m]').forEach(n => n.onclick = () => {
        m = n.dataset.m;
        $$('#tModes .cat').forEach(x => x.classList.toggle('on', x.dataset.m === m));
      });
      $$('[data-delcat]').forEach(n => n.onclick = async () => {
        t.cats = catsOf().filter(c => c.id !== n.dataset.delcat);
        await touchMeta(); closeSheet(); sheetTrip();
      });
      $('#tAddCat').onclick = async () => {
        const name = $('#tNewCat').value.trim(); if (!name) return;
        t.cats = catsOf().concat([{ id:'c' + Date.now().toString(36), name, mark:$('#tNewMark').value }]);
        await touchMeta(); closeSheet(); sheetTrip();
      };
      $('#tPort').onclick = () => { closeSheet(); sheetPorting(); };
      $('#tCopy').onclick = () => {
        navigator.clipboard.writeText(t.code).then(() => toast('代碼已複製'), () => toast('複製失敗'));
      };
      $('#tSave').onclick = async () => {
        t.name = $('#tName').value.trim() || '未命名旅程';
        t.startDate = $('#tStart').value || t.startDate;
        t.days = clamp(parseInt($('#tDays').value, 10) || 1, 1, 60);
        t.defaultMode = m;
        t.autoRoute = $('#tAuto').checked;
        const nick = $('#tNick').value.trim();
        if (nick) { t.nick = nick; await kvSet('nick', nick); }
        if (S.day >= t.days) S.day = t.days - 1;
        await touchMeta(); closeSheet(); render();
      };
      $('#tForget').onclick = async () => {
        if (!confirm('把「' + t.name + '」從這台裝置移除？雲端資料不會刪除。')) return;
        for (const c of S.cards) await dbDel('cards', c.id);
        await dbDel('trips', t.code);
        closeSheet(); leaveTrip();
      };
    });
}

/* ═══ 啟動 ═══════════════════════════════════════════════════ */
/* 實測可見高度，寫成 --vh。三個事件都要聽：
   resize 是轉向與鍵盤，visualViewport 的 resize 是工具列收合，
   scroll 是 iOS 把工具列推走的那一段過渡。 */
const STANDALONE = (matchMedia('(display-mode: standalone)').matches
                   || matchMedia('(display-mode: fullscreen)').matches
                   || navigator.standalone === true);
function fitViewport() {
  const vv = window.visualViewport;
  /* 瀏覽器裡要用 visualViewport：innerHeight 含被工具列蓋住的那一段。
     加到主畫面的獨立模式沒有工具列，innerHeight 就是整個螢幕；
     而 visualViewport 在啟動動畫還沒結束時會回報偏小的高度，
     量到就定住，於是頁底永遠少一截。獨立模式取兩者較大的。 */
  const h = STANDALONE
    ? Math.round(Math.max(window.innerHeight || 0, vv ? vv.height : 0))
    : Math.round(vv ? vv.height : window.innerHeight);
  if (h > 0) document.documentElement.style.setProperty('--vh', h + 'px');
  /* 鍵盤跳出來時 iOS 會把「版面視窗」往上捲，position:fixed 是釘在版面視窗上的，
     於是整個畫面看起來被頂掉。visualViewport.offsetTop 就是被捲掉的量，
     把它加回 top 就抵銷了。不補這個，只要點到輸入框畫面就會彈走。 */
  const off = vv ? Math.round(vv.offsetTop) : 0;
  document.documentElement.style.setProperty('--vtop', (off > 0 ? off : 0) + 'px');
}
/* 啟動那一秒內連量幾次：獨立模式的第一次量測常常落在啟動動畫中間。 */
function fitViewportSoon() {
  [0, 120, 400, 1000].forEach(t => setTimeout(fitViewport, t));
  requestAnimationFrame(fitViewport);
}

async function boot() {
  fitViewportSoon();
  addEventListener('resize', fitViewport);
  addEventListener('pageshow', fitViewportSoon);
  addEventListener('orientationchange', () => setTimeout(fitViewport, 250));
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', fitViewport);
    visualViewport.addEventListener('scroll', fitViewport);
  }
  applyBoard(HUES[0]);
  await openDB();
  await renderGate();

  $('#btnAdd').onclick = sheetAdd;
  $('#btnSet').onclick = sheetTrip;
  $('#btnEdit').onclick = () => {
    S.edit = !S.edit; S.open = null;
    $('#btnEdit').classList.toggle('fill', S.edit);
    $('#btnEdit').textContent = S.edit ? '完成' : '編輯';
    render();
  };
  $('#sheetClose').onclick = closeSheet;
  $('#sheetScrim').onclick = closeSheet;
  $('#syncBtn').onclick = () => syncNow();

  addEventListener('online',  () => { S.online = true;  renderSync(); syncNow(true); });
  addEventListener('offline', () => { S.online = false; renderSync(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && S.trip) { syncNow(true); render(); }
  });

  if ('serviceWorker' in navigator) {
    /* 快取策略是 stale-while-revalidate：舊版會先上場，新版在背景寫回去。
       在手機上這代表「改版後要開第二次才看得到新的」——實際上使用者
       只會覺得改的東西沒生效。新的 sw 接管時（controllerchange）自動重載一次，
       同一次開啟就會換成新版。旗標防止無限重載。 */
    /* 第一次造訪時本來就沒有 controller，sw 的 clients.claim() 也會觸發這個事件，
       那次不該重載（頁面本來就是最新的）。只有「本來有舊 sw、現在換人」才重載。 */
    const hadController = !!navigator.serviceWorker.controller;
    let swapped = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (swapped || !hadController) return;
      swapped = true;
      location.reload();
    });
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
}
boot();
</script>
</body>
</html>
